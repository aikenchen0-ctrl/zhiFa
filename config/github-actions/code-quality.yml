name: Code Quality Assurance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for SonarQube analysis
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install Dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: Type Check
      run: npm run type-check
      continue-on-error: false
    
    - name: Lint Check
      run: |
        npm run lint:check
        npm run lint:report
      continue-on-error: false
    
    - name: Format Check
      run: npm run format:check
      continue-on-error: false
    
    - name: Build Project
      run: npm run build
      continue-on-error: false
    
    - name: Run Tests with Coverage
      run: npm run test:coverage
      continue-on-error: false
    
    - name: Upload Test Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: NPM Audit
      run: |
        npm audit --audit-level=moderate --json > npm-audit-report.json || true
        npm audit --audit-level=moderate
      continue-on-error: true
    
    - name: Snyk Security Scan
      if: env.SNYK_TOKEN != ''
      run: |
        npm install -g snyk
        snyk auth ${{ secrets.SNYK_TOKEN }}
        snyk test --severity-threshold=medium --json > snyk-report.json || true
        snyk test --severity-threshold=medium
      continue-on-error: true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          npm-audit-report.json
          snyk-report.json

  code-analysis:
    name: Code Analysis with SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: Run Tests with Coverage
      run: npm run test:coverage
    
    - name: SonarQube Quality Gate
      if: env.SONAR_TOKEN != ''
      uses: sonarqube-quality-gate-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: SonarQube Analysis
      if: env.SONAR_TOKEN != ''
      run: |
        npm install -g sonarqube-scanner
        sonar-scanner \
          -Dsonar.projectKey=claude-flow-workspace \
          -Dsonar.sources=src \
          -Dsonar.tests=tests \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Analysis Tools
      run: |
        npm install -g typescript-complexity-analyzer
        npm install -g jscpd
    
    - name: Complexity Analysis
      run: |
        echo "## Code Complexity Report" > complexity-report.md
        echo "" >> complexity-report.md
        
        # TypeScript complexity
        tca src --format markdown >> complexity-report.md || true
        
        # Code duplication
        echo "" >> complexity-report.md
        echo "## Code Duplication Report" >> complexity-report.md
        jscpd src --format markdown >> complexity-report.md || true
    
    - name: Upload Complexity Report
      uses: actions/upload-artifact@v3
      with:
        name: complexity-report
        path: complexity-report.md

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Check for Known Vulnerabilities
      run: |
        npm install -g @cyclonedx/cyclonedx-npm
        cyclonedx-npm --output-file sbom.json
    
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'claude-flow-workspace'
        path: '.'
        format: 'JSON'
        out: 'dependency-check-report'
    
    - name: Upload SBOM and Dependency Report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-reports
        path: |
          sbom.json
          dependency-check-report/

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, code-analysis, complexity-analysis]
    if: always()
    
    steps:
    - name: Check Quality Gate Status
      run: |
        if [ "${{ needs.code-quality.result }}" != "success" ]; then
          echo "❌ Code quality checks failed"
          exit 1
        fi
        
        if [ "${{ needs.security-scan.result }}" == "failure" ]; then
          echo "❌ Critical security vulnerabilities found"
          exit 1
        fi
        
        echo "✅ Quality gate passed"