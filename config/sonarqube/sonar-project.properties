# SonarQube Configuration
sonar.projectKey=claude-flow-workspace
sonar.projectName=Claude Flow Workspace
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language specific settings
sonar.typescript.node=node_modules/.bin/node
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Code quality settings
sonar.qualitygate.wait=true

# Duplication settings
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Security settings
sonar.security.hotspots.inheritFromParent=true

# Issues exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

# Technical debt settings
sonar.technicalDebt.developmentCost=30
sonar.technicalDebt.ratingGrid=0.1,0.2,0.5,1

# Analysis parameters
sonar.analysis.mode=publish
sonar.branch.name=${env.BRANCH_NAME}
sonar.pullrequest.key=${env.PR_NUMBER}
sonar.pullrequest.branch=${env.PR_BRANCH}
sonar.pullrequest.base=${env.PR_BASE}

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.min.js,**/*.bundle.js