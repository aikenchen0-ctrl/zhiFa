<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - 移动端测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        .info {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .emoji {
            font-size: 2rem;
            margin: 10px 0;
        }
        
        .time {
            font-style: italic;
            opacity: 0.8;
        }
        
        /* 移动端优化 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>🎊 Hello World! 自动更新测试</h1>
        <p>🎉 恭喜！Claude Flow + GitHub Pages 自动部署成功！</p>
        <p>⚡ 这是一个自动更新测试 - 时间: $(new Date().toLocaleString('zh-CN'))</p>
        <p>📱 这个页面现在可以在任何设备上访问</p>
        
        <div class="info">
            <div>🌐 部署地址: https://aikenchen0-ctrl.github.io/zhiFa/</div>
            <div>⏰ 部署时间: <span class="time" id="deployTime"></span></div>
            <div>📱 访问设备: <span id="deviceInfo"></span></div>
            <div>🌍 用户代理: <span id="userAgent"></span></div>
        </div>
        
        <p>✨ 现在您可以：</p>
        <p>• 修改代码 → Claude Flow自动提交 → GitHub自动部署</p>
        <p>• 在任何设备上实时查看更新</p>
        <p>• 无需配置隧道或VPN</p>
    </div>

    <script>
        // 显示部署时间
        document.getElementById('deployTime').textContent = new Date().toLocaleString('zh-CN');
        
        // 显示设备信息
        document.getElementById('deviceInfo').textContent = 
            `${window.innerWidth}×${window.innerHeight} (${window.devicePixelRatio}x)`;
        
        // 显示用户代理（简化版）
        const ua = navigator.userAgent;
        let device = 'Unknown';
        if (/iPhone|iPad|iPod/.test(ua)) device = 'iOS';
        else if (/Android/.test(ua)) device = 'Android';
        else if (/Windows/.test(ua)) device = 'Windows';
        else if (/Mac/.test(ua)) device = 'Mac';
        
        document.getElementById('userAgent').textContent = device;
        
        // 添加点击效果
        document.querySelector('.container').addEventListener('click', function() {
            this.style.transform = 'scale(0.98)';
            setTimeout(() => {
                this.style.transform = 'scale(1)';
            }, 100);
        });
        
        console.log('🎯 Hello World 页面加载成功！');
        console.log('📊 页面信息:', {
            url: window.location.href,
            timestamp: new Date().toISOString(),
            viewport: `${window.innerWidth}×${window.innerHeight}`,
            userAgent: navigator.userAgent
        });
    </script>
</body>
</html>
