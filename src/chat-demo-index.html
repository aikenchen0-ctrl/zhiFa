<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message Area Component Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
            text-align: left;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: block;
        }

        .feature h3 {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .feature p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .demo-button {
            display: inline-block;
            background: linear-gradient(45deg, #1a73e8, #4285f4);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 500;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
        }

        .demo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
        }

        .secondary-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        .tech-stack {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tech-stack h4 {
            color: white;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tech-tag {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .demo-button {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 ChatMessageArea</h1>
        <p class="subtitle">基于 PIXI.js v8 的高性能聊天消息区组件</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">🎨</span>
                <h3>Vision UI 设计</h3>
                <p>玻璃材质气泡、文本阴影、自适应对齐，支持详细和简单两种气泡类型</p>
            </div>

            <div class="feature">
                <span class="feature-icon">📱</span>
                <h3>多种消息类型</h3>
                <p>文本、图片、语音、视频、链接、系统消息，完整的聊天功能支持</p>
            </div>

            <div class="feature">
                <span class="feature-icon">🎯</span>
                <h3>丰富交互功能</h3>
                <p>点击显示操作菜单，支持复制、转发、收藏、多选等8种操作</p>
            </div>

            <div class="feature">
                <span class="feature-icon">⚡</span>
                <h3>虚拟滚动优化</h3>
                <p>支持数千条消息流畅滚动，智能渲染，动量滚动体验</p>
            </div>
        </div>

        <div style="margin: 30px 0;">
            <a href="chat-message-demo.html" class="demo-button">
                🚀 查看完整演示
            </a>
            <a href="../docs/ChatMessageArea-README.md" class="demo-button secondary-button">
                📖 文档说明
            </a>
        </div>

        <div class="tech-stack">
            <h4>技术栈</h4>
            <div class="tech-tags">
                <span class="tech-tag">PIXI.js v8</span>
                <span class="tech-tag">ES6 模块</span>
                <span class="tech-tag">虚拟滚动</span>
                <span class="tech-tag">GPU 加速</span>
                <span class="tech-tag">响应式设计</span>
                <span class="tech-tag">高性能</span>
            </div>
        </div>
    </div>

    <script>
        // Add some animation on load
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(30px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.8s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);
        });

        // Add click tracking
        document.querySelectorAll('.demo-button').forEach(button => {
            button.addEventListener('click', function(e) {
                console.log('Demo button clicked:', this.textContent.trim());
            });
        });
    </script>
</body>
</html>
