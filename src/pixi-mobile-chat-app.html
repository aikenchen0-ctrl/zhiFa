<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PIXI.js v8 Mobile Chat App</title>
    
    <!-- PIXI.js v8 CDN -->
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        /* Debug overlay */
        #debug-overlay {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            max-width: 200px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        
        #debug-toggle {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1001;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 2000;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div>Loading Chat App...</div>
    </div>
    
    <!-- Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- Debug Controls -->
    <button id="debug-toggle">Debug</button>
    <div id="debug-overlay"></div>

    <script>
        // Enhanced Logger System
        class MobileChatLogger {
            constructor() {
                this.logs = [];
                this.maxLogs = 100;
                this.debugElement = document.getElementById('debug-overlay');
                this.isDebugVisible = false;
                
                // Performance tracking
                this.performanceMetrics = {
                    startTime: performance.now(),
                    frameCount: 0,
                    lastFrameTime: 0,
                    fps: 0,
                    memoryUsage: 0
                };
                
                this.setupDebugToggle();
                this.trackPerformance();
            }
            
            log(level, category, message, data = null) {
                const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
                const logEntry = {
                    timestamp,
                    level,
                    category,
                    message,
                    data
                };
                
                this.logs.push(logEntry);
                if (this.logs.length > this.maxLogs) {
                    this.logs.shift();
                }
                
                // Console output
                const consoleMethod = level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log';
                console[consoleMethod](`[${timestamp}] ${category}: ${message}`, data || '');
                
                // Update debug overlay
                this.updateDebugOverlay();
            }
            
            info(category, message, data) { this.log('info', category, message, data); }
            warn(category, message, data) { this.log('warn', category, message, data); }
            error(category, message, data) { this.log('error', category, message, data); }
            
            setupDebugToggle() {
                const toggleBtn = document.getElementById('debug-toggle');
                toggleBtn.addEventListener('click', () => {
                    this.isDebugVisible = !this.isDebugVisible;
                    this.debugElement.style.display = this.isDebugVisible ? 'block' : 'none';
                    this.updateDebugOverlay();
                });
            }
            
            trackPerformance() {
                setInterval(() => {
                    this.performanceMetrics.fps = Math.round(this.performanceMetrics.frameCount);
                    this.performanceMetrics.frameCount = 0;
                    
                    if (performance.memory) {
                        this.performanceMetrics.memoryUsage = Math.round(
                            performance.memory.usedJSHeapSize / 1024 / 1024
                        );
                    }
                    
                    if (this.isDebugVisible) {
                        this.updateDebugOverlay();
                    }
                }, 1000);
            }
            
            updateDebugOverlay() {
                if (!this.isDebugVisible) return;
                
                const recentLogs = this.logs.slice(-10);
                const logHtml = recentLogs.map(log => 
                    `<div style="color: ${this.getLogColor(log.level)}">
                        [${log.timestamp}] ${log.category}: ${log.message}
                    </div>`
                ).join('');
                
                const metricsHtml = `
                    <div style="border-top: 1px solid #333; margin-top: 10px; padding-top: 10px;">
                        <div>FPS: ${this.performanceMetrics.fps}</div>
                        <div>Memory: ${this.performanceMetrics.memoryUsage}MB</div>
                        <div>Uptime: ${Math.round((performance.now() - this.performanceMetrics.startTime) / 1000)}s</div>
                    </div>
                `;
                
                this.debugElement.innerHTML = logHtml + metricsHtml;
                this.debugElement.scrollTop = this.debugElement.scrollHeight;
            }
            
            getLogColor(level) {
                switch(level) {
                    case 'error': return '#ff6b6b';
                    case 'warn': return '#ffd93d';
                    case 'info': return '#6bcf7f';
                    default: return '#ffffff';
                }
            }
            
            frameCount() {
                this.performanceMetrics.frameCount++;
            }
        }

        // Mobile Chat Application Class
        class MobileChatApp {
            constructor() {
                this.logger = new MobileChatLogger();
                this.app = null;
                this.containers = {};
                this.isInitialized = false;
                
                // Mobile-specific settings
                this.mobileConfig = {
                    scale: window.devicePixelRatio || 1,
                    maxTextureSize: 2048,
                    preferWebGL2: true,
                    powerPreference: 'high-performance'
                };
                
                this.logger.info('APP', 'Mobile Chat App initializing...', this.mobileConfig);
                this.init();
            }
            
            async init() {
                try {
                    await this.setupPixiApp();
                    await this.createContainers();
                    await this.setupResponsiveLayout();
                    await this.setupRenderLoop();
                    await this.setupMobileOptimizations();
                    
                    this.isInitialized = true;
                    this.hideLoadingScreen();
                    this.logger.info('APP', 'Application initialized successfully');
                    
                } catch (error) {
                    this.logger.error('APP', 'Initialization failed', error);
                    this.showErrorScreen(error);
                }
            }
            
            async setupPixiApp() {
                this.logger.info('PIXI', 'Setting up PIXI Application...');
                
                // PIXI.js v8 Application setup with mobile optimizations
                const appConfig = {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    backgroundColor: 0x1a1a2e,
                    resolution: this.mobileConfig.scale,
                    autoDensity: true,
                    powerPreference: this.mobileConfig.powerPreference,
                    hello: true, // PIXI v8 feature
                    
                    // WebGL settings for mobile
                    antialias: false, // Disable for better mobile performance
                    preserveDrawingBuffer: false,
                    clearBeforeRender: true,
                    
                    // Event system
                    eventMode: 'auto',
                    eventFeatures: {
                        move: true,
                        globalMove: false,
                        click: true,
                        wheel: false
                    }
                };
                
                this.app = new PIXI.Application();
                await this.app.init(appConfig);
                
                // Add canvas to DOM
                const container = document.getElementById('canvas-container');
                container.appendChild(this.app.canvas);
                
                this.logger.info('PIXI', 'PIXI Application created', {
                    renderer: this.app.renderer.type,
                    resolution: this.app.renderer.resolution,
                    size: { width: this.app.screen.width, height: this.app.screen.height }
                });
            }
            
            async createContainers() {
                this.logger.info('CONTAINERS', 'Creating main containers...');
                
                // Main container structure
                this.containers = {
                    // Background layer
                    background: new PIXI.Container(),
                    
                    // Chat interface layers
                    chatBackground: new PIXI.Container(),
                    messageContainer: new PIXI.Container(),
                    inputContainer: new PIXI.Container(),
                    
                    // UI overlays
                    headerContainer: new PIXI.Container(),
                    navigationContainer: new PIXI.Container(),
                    overlayContainer: new PIXI.Container(),
                    
                    // Interactive elements
                    buttonContainer: new PIXI.Container(),
                    modalContainer: new PIXI.Container(),
                    
                    // Debug and development
                    debugContainer: new PIXI.Container()
                };
                
                // Add containers to stage in correct order
                Object.values(this.containers).forEach(container => {
                    this.app.stage.addChild(container);
                    container.sortableChildren = true;
                });
                
                // Set z-indices for proper layering
                this.containers.background.zIndex = 0;
                this.containers.chatBackground.zIndex = 10;
                this.containers.messageContainer.zIndex = 20;
                this.containers.inputContainer.zIndex = 30;
                this.containers.headerContainer.zIndex = 40;
                this.containers.navigationContainer.zIndex = 50;
                this.containers.buttonContainer.zIndex = 60;
                this.containers.overlayContainer.zIndex = 70;
                this.containers.modalContainer.zIndex = 80;
                this.containers.debugContainer.zIndex = 90;
                
                this.logger.info('CONTAINERS', 'All containers created and configured');
                await this.createVisionUIBackground();
            }
            
            async createVisionUIBackground() {
                this.logger.info('UI', 'Creating Vision UI background...');
                
                // Create gradient background
                const graphics = new PIXI.Graphics();
                
                // Vision UI style gradient with glassmorphism effect
                const gradient = this.createGradientTexture();
                graphics.beginTextureFill({ texture: gradient });
                graphics.drawRect(0, 0, this.app.screen.width, this.app.screen.height);
                graphics.endFill();
                
                // Add noise texture for depth
                const noiseOverlay = this.createNoiseOverlay();
                
                this.containers.background.addChild(graphics);
                this.containers.background.addChild(noiseOverlay);
                
                // Create glassmorphism panels
                await this.createGlassPanels();
            }
            
            createGradientTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = this.app.screen.width;
                canvas.height = this.app.screen.height;
                const ctx = canvas.getContext('2d');
                
                // Create radial gradient
                const gradient = ctx.createRadialGradient(
                    canvas.width * 0.3, canvas.height * 0.3, 0,
                    canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height)
                );
                
                gradient.addColorStop(0, 'rgba(26, 26, 46, 0.9)');
                gradient.addColorStop(0.3, 'rgba(22, 33, 62, 0.8)');
                gradient.addColorStop(0.7, 'rgba(15, 52, 96, 0.7)');
                gradient.addColorStop(1, 'rgba(10, 25, 47, 0.9)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                return PIXI.Texture.from(canvas);
            }
            
            createNoiseOverlay() {
                const graphics = new PIXI.Graphics();
                
                // Subtle noise pattern
                for (let i = 0; i < 1000; i++) {
                    const x = Math.random() * this.app.screen.width;
                    const y = Math.random() * this.app.screen.height;
                    const alpha = Math.random() * 0.1;
                    
                    graphics.beginFill(0xffffff, alpha);
                    graphics.drawCircle(x, y, 1);
                    graphics.endFill();
                }
                
                return graphics;
            }
            
            async createGlassPanels() {
                this.logger.info('UI', 'Creating glassmorphism panels...');
                
                // Chat area glass panel
                const chatPanel = this.createGlassPanel(
                    20, 80, 
                    this.app.screen.width - 40, 
                    this.app.screen.height - 180
                );
                this.containers.chatBackground.addChild(chatPanel);
                
                // Input area glass panel
                const inputPanel = this.createGlassPanel(
                    20, this.app.screen.height - 80,
                    this.app.screen.width - 40, 60
                );
                this.containers.inputContainer.addChild(inputPanel);
                
                // Header glass panel
                const headerPanel = this.createGlassPanel(
                    0, 0,
                    this.app.screen.width, 70
                );
                this.containers.headerContainer.addChild(headerPanel);
            }
            
            createGlassPanel(x, y, width, height, borderRadius = 16) {
                const graphics = new PIXI.Graphics();
                
                // Glass background
                graphics.beginFill(0xffffff, 0.1);
                graphics.drawRoundedRect(x, y, width, height, borderRadius);
                graphics.endFill();
                
                // Border
                graphics.lineStyle(1, 0xffffff, 0.2);
                graphics.drawRoundedRect(x, y, width, height, borderRadius);
                
                // Inner glow
                graphics.lineStyle(1, 0xffffff, 0.1);
                graphics.drawRoundedRect(x + 1, y + 1, width - 2, height - 2, borderRadius - 1);
                
                return graphics;
            }
            
            async setupResponsiveLayout() {
                this.logger.info('LAYOUT', 'Setting up responsive layout...');
                
                const handleResize = () => {
                    const newWidth = window.innerWidth;
                    const newHeight = window.innerHeight;
                    
                    this.app.renderer.resize(newWidth, newHeight);
                    this.repositionContainers();
                    
                    this.logger.info('LAYOUT', 'Layout resized', { 
                        width: newWidth, 
                        height: newHeight 
                    });
                };
                
                window.addEventListener('resize', handleResize);
                window.addEventListener('orientationchange', () => {
                    setTimeout(handleResize, 100);
                });
                
                // Initial positioning
                this.repositionContainers();
            }
            
            repositionContainers() {
                // Update container positions based on screen size
                const { width, height } = this.app.screen;
                
                // Update background
                this.containers.background.removeChildren();
                this.createVisionUIBackground();
                
                this.logger.info('LAYOUT', 'Containers repositioned for new dimensions');
            }
            
            async setupRenderLoop() {
                this.logger.info('RENDER', 'Setting up render loop...');
                
                this.app.ticker.add((deltaTime) => {
                    this.logger.frameCount();
                    this.update(deltaTime);
                });
                
                this.app.ticker.start();
                this.logger.info('RENDER', 'Render loop started');
            }
            
            update(deltaTime) {
                // Main update loop - add game logic here
                // Update animations, handle interactions, etc.
            }
            
            async setupMobileOptimizations() {
                this.logger.info('MOBILE', 'Applying mobile optimizations...');
                
                // Texture management
                PIXI.settings.RESOLUTION = this.mobileConfig.scale;
                PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.LINEAR;
                
                // Memory management
                setInterval(() => {
                    if (this.app.renderer.textureGC) {
                        this.app.renderer.textureGC.run();
                    }
                }, 30000);
                
                // Touch event optimization
                this.app.stage.interactive = true;
                this.app.stage.on('pointerdown', this.handleTouch.bind(this));
                this.app.stage.on('pointermove', this.handleTouchMove.bind(this));
                this.app.stage.on('pointerup', this.handleTouchEnd.bind(this));
                
                this.logger.info('MOBILE', 'Mobile optimizations applied');
            }
            
            handleTouch(event) {
                this.logger.info('INPUT', 'Touch started', {
                    x: event.data.global.x,
                    y: event.data.global.y
                });
            }
            
            handleTouchMove(event) {
                // Handle touch move for scrolling, dragging, etc.
            }
            
            handleTouchEnd(event) {
                this.logger.info('INPUT', 'Touch ended');
            }
            
            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }
            
            showErrorScreen(error) {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.innerHTML = `
                    <div style="color: #ff6b6b; text-align: center;">
                        <h3>Application Error</h3>
                        <p>${error.message}</p>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 6px;">
                            Reload
                        </button>
                    </div>
                `;
            }
        }
        
        // Initialize app when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                new MobileChatApp();
            });
        } else {
            new MobileChatApp();
        }
        
        // Prevent default mobile behaviors
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('gesturestart', (e) => {
            e.preventDefault();
        });
        
        document.addEventListener('gesturechange', (e) => {
            e.preventDefault();
        });
        
        document.addEventListener('gestureend', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
