<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile 120Hz Performance Demo - Connection Lines</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .performance-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #888;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        
        .stat-label {
            font-size: 10px;
            color: #666;
        }
        
        .main-container {
            padding-top: 80px;
            height: 100vh;
            position: relative;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .connection-canvas {
            position: relative;
            width: 100%;
            height: 200vh;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0a 100%);
        }
        
        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00f4ff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 244, 255, 0.5);
            z-index: 10;
            will-change: transform;
        }
        
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f4ff, transparent);
            transform-origin: left center;
            opacity: 0.6;
            will-change: transform, opacity;
            contain: layout style paint;
            pointer-events: none;
        }
        
        .connection-line.animated {
            animation: pulse 2s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 0.3; }
            to { opacity: 0.8; }
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .control-row:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            font-size: 12px;
            color: #ccc;
            min-width: 80px;
        }
        
        .control-input {
            flex: 1;
            margin: 0 10px;
        }
        
        .control-value {
            font-size: 12px;
            color: #fff;
            min-width: 40px;
            text-align: right;
        }
        
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #333;
            outline: none;
            border-radius: 2px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #00f4ff;
            cursor: pointer;
            border-radius: 50%;
        }
        
        .button {
            background: #00f4ff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }
        
        .button:active {
            transform: scale(0.95);
        }
        
        .performance-indicator {
            position: fixed;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, #ff0000, #ffff00, #00ff00);
            border-radius: 2px;
            opacity: 0.7;
        }
        
        .performance-marker {
            position: absolute;
            right: 0;
            width: 8px;
            height: 2px;
            background: #fff;
            border-radius: 1px;
            transition: transform 0.1s ease;
        }
        
        .debug-panel {
            position: fixed;
            top: 80px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-radius: 6px;
            font-size: 10px;
            color: #ccc;
            max-width: 200px;
            display: none;
        }
        
        .debug-panel.visible {
            display: block;
        }
        
        .memory-pressure-high {
            filter: none !important;
            animation: none !important;
        }
        
        @media (max-height: 600px) {
            .header {
                padding: 5px 15px;
            }
            
            .header h1 {
                font-size: 16px;
            }
            
            .controls {
                bottom: 10px;
                left: 10px;
                right: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>120Hz Performance Demo</h1>
        <div class="performance-stats">
            <div class="stat">
                <div class="stat-value" id="fps-value">0</div>
                <div class="stat-label">FPS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="frame-time-value">0</div>
                <div class="stat-label">Frame(ms)</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="memory-value">0</div>
                <div class="stat-label">Memory(%)</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="connections-value">0</div>
                <div class="stat-label">Lines</div>
            </div>
        </div>
    </div>
    
    <div class="main-container" id="mainContainer">
        <div class="connection-canvas" id="canvas"></div>
    </div>
    
    <div class="performance-indicator">
        <div class="performance-marker" id="performanceMarker"></div>
    </div>
    
    <div class="debug-panel" id="debugPanel">
        <div>Device: <span id="deviceInfo"></span></div>
        <div>Viewport: <span id="viewportInfo"></span></div>
        <div>Visible: <span id="visibleConnections"></span></div>
        <div>Pooled: <span id="pooledConnections"></span></div>
        <div>Quality: <span id="currentQuality"></span></div>
    </div>
    
    <div class="controls">
        <div class="control-row">
            <span class="control-label">连接数</span>
            <input type="range" min="100" max="2000" value="1000" id="connectionCount" class="control-input">
            <span class="control-value" id="connectionCountValue">1000</span>
        </div>
        <div class="control-row">
            <span class="control-label">动画速度</span>
            <input type="range" min="0" max="3" value="1" step="0.1" id="animationSpeed" class="control-input">
            <span class="control-value" id="animationSpeedValue">1.0</span>
        </div>
        <div class="control-row">
            <button class="button" id="toggleAnimation">暂停动画</button>
            <button class="button" id="toggleDebug">调试信息</button>
            <button class="button" id="resetDemo">重置</button>
        </div>
    </div>

    <script type="module">
        import Mobile120HzOptimizer from './src/performance/mobile-120hz-optimizer.js';
        import PerformanceMonitor from './src/performance/performance-monitor.js';
        
        class PerformanceDemo {
            constructor() {
                this.optimizer = new Mobile120HzOptimizer();
                this.monitor = new PerformanceMonitor();
                this.canvas = document.getElementById('canvas');
                this.connections = [];
                this.nodes = [];
                this.isAnimating = true;
                this.debugMode = false;
                
                this.connectionCount = 1000;
                this.animationSpeed = 1.0;
                
                this.initializeDemo();
                this.setupControls();
                this.startPerformanceTracking();
            }
            
            initializeDemo() {
                // Create nodes
                this.generateNodes();
                
                // Create connections
                this.generateConnections();
                
                // Start optimization
                this.optimizer.startMonitoring();
                this.monitor.startMonitoring();
                
                // Setup touch scrolling optimization
                this.optimizer.optimizeTouchScrolling(document.getElementById('mainContainer'));
                
                console.log('Performance demo initialized with 120Hz optimization');
            }
            
            generateNodes() {
                this.nodes = [];
                const nodeCount = Math.min(50, Math.floor(this.connectionCount / 20));
                
                for (let i = 0; i < nodeCount; i++) {
                    const node = {
                        id: i,
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * (window.innerHeight * 2),
                        element: this.createNodeElement()
                    };
                    
                    node.element.style.left = node.x + 'px';
                    node.element.style.top = node.y + 'px';
                    
                    this.canvas.appendChild(node.element);
                    this.nodes.push(node);
                }
            }
            
            createNodeElement() {
                const node = document.createElement('div');
                node.className = 'node';
                return node;
            }
            
            generateConnections() {
                // Clear existing connections
                this.clearConnections();
                
                for (let i = 0; i < this.connectionCount; i++) {
                    const connection = this.createConnection(i);
                    this.connections.push(connection);
                }
                
                // Apply optimization
                this.optimizer.optimizeConnectionRendering(this.connections);
                
                this.updateConnectionsDisplay();
            }
            
            createConnection(id) {
                const nodeA = this.nodes[Math.floor(Math.random() * this.nodes.length)];
                const nodeB = this.nodes[Math.floor(Math.random() * this.nodes.length)];
                
                if (!nodeA || !nodeB) return null;
                
                const dx = nodeB.x - nodeA.x;
                const dy = nodeB.y - nodeA.y;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                
                const element = document.createElement('div');
                element.className = 'connection-line';
                element.dataset.id = id;
                
                if (this.isAnimating) {
                    element.classList.add('animated');
                }
                
                return {
                    id: id,
                    x: nodeA.x,
                    y: nodeA.y,
                    length: length,
                    angle: angle,
                    opacity: Math.random() * 0.5 + 0.3,
                    element: element,
                    nodeA: nodeA,
                    nodeB: nodeB,
                    getBoundingRect: () => element.getBoundingClientRect()
                };
            }
            
            updateConnectionsDisplay() {
                requestAnimationFrame(() => {
                    this.connections.forEach(connection => {
                        if (!connection) return;
                        
                        const transform = `translate3d(${connection.x}px, ${connection.y}px, 0) rotate(${connection.angle}deg) scaleX(${connection.length / 100})`;
                        connection.element.style.transform = transform;
                        connection.element.style.opacity = connection.opacity;
                        
                        if (!connection.element.parentNode) {
                            this.canvas.appendChild(connection.element);
                        }
                    });
                });
            }
            
            clearConnections() {
                this.connections.forEach(connection => {
                    if (connection && connection.element && connection.element.parentNode) {
                        connection.element.remove();
                    }
                });
                this.connections = [];
            }
            
            setupControls() {
                const connectionCountSlider = document.getElementById('connectionCount');
                const animationSpeedSlider = document.getElementById('animationSpeed');
                const toggleAnimationBtn = document.getElementById('toggleAnimation');
                const toggleDebugBtn = document.getElementById('toggleDebug');
                const resetDemoBtn = document.getElementById('resetDemo');
                
                connectionCountSlider.addEventListener('input', (e) => {
                    this.connectionCount = parseInt(e.target.value);
                    document.getElementById('connectionCountValue').textContent = this.connectionCount;
                    this.generateConnections();
                });
                
                animationSpeedSlider.addEventListener('input', (e) => {
                    this.animationSpeed = parseFloat(e.target.value);
                    document.getElementById('animationSpeedValue').textContent = this.animationSpeed.toFixed(1);
                    this.updateAnimationSpeed();
                });
                
                toggleAnimationBtn.addEventListener('click', () => {
                    this.isAnimating = !this.isAnimating;
                    toggleAnimationBtn.textContent = this.isAnimating ? '暂停动画' : '开始动画';
                    this.toggleAnimation();
                });
                
                toggleDebugBtn.addEventListener('click', () => {
                    this.debugMode = !this.debugMode;
                    document.getElementById('debugPanel').classList.toggle('visible', this.debugMode);
                });
                
                resetDemoBtn.addEventListener('click', () => {
                    this.resetDemo();
                });
            }
            
            updateAnimationSpeed() {
                const connections = document.querySelectorAll('.connection-line');
                connections.forEach(connection => {
                    connection.style.animationDuration = `${2 / this.animationSpeed}s`;
                });
            }
            
            toggleAnimation() {
                const connections = document.querySelectorAll('.connection-line');
                connections.forEach(connection => {
                    if (this.isAnimating) {
                        connection.classList.add('animated');
                    } else {
                        connection.classList.remove('animated');
                    }
                });
            }
            
            resetDemo() {
                this.connectionCount = 1000;
                this.animationSpeed = 1.0;
                this.isAnimating = true;
                
                document.getElementById('connectionCount').value = this.connectionCount;
                document.getElementById('animationSpeed').value = this.animationSpeed;
                document.getElementById('connectionCountValue').textContent = this.connectionCount;
                document.getElementById('animationSpeedValue').textContent = this.animationSpeed.toFixed(1);
                document.getElementById('toggleAnimation').textContent = '暂停动画';
                
                this.monitor.clearMetrics();
                this.generateNodes();
                this.generateConnections();
            }
            
            startPerformanceTracking() {
                setInterval(() => {
                    const metrics = this.monitor.getPerformanceReport();
                    
                    // Update performance display
                    document.getElementById('fps-value').textContent = Math.round(metrics.fps.current || 0);
                    document.getElementById('frame-time-value').textContent = (metrics.frameTime.current || 0).toFixed(1);
                    document.getElementById('memory-value').textContent = 
                        metrics.memory.current ? Math.round(metrics.memory.current.percentage) : 0;
                    document.getElementById('connections-value').textContent = this.connections.length;
                    
                    // Update performance indicator
                    const performanceScore = Math.min(100, (metrics.fps.current || 0) / 120 * 100);
                    const marker = document.getElementById('performanceMarker');
                    marker.style.transform = `translateY(${100 - performanceScore}px)`;
                    
                    // Update debug info
                    if (this.debugMode) {
                        this.updateDebugInfo(metrics);
                    }
                    
                    // Check for memory pressure
                    if (metrics.memory.current && metrics.memory.current.percentage > 80) {
                        document.body.classList.add('memory-pressure-high');
                    } else {
                        document.body.classList.remove('memory-pressure-high');
                    }
                    
                }, 100);
            }
            
            updateDebugInfo(metrics) {
                const optimizerMetrics = this.optimizer.getPerformanceMetrics();
                
                document.getElementById('deviceInfo').textContent = 
                    `${navigator.userAgent.match(/iPhone|iPad|Android/i)?.[0] || 'Desktop'}`;
                document.getElementById('viewportInfo').textContent = 
                    `${window.innerWidth}x${window.innerHeight}`;
                document.getElementById('visibleConnections').textContent = 
                    optimizerMetrics.visibleConnections;
                document.getElementById('pooledConnections').textContent = 
                    optimizerMetrics.pooledConnections;
                document.getElementById('currentQuality').textContent = 
                    optimizerMetrics.optimizationLevel;
            }
        }
        
        // Initialize demo when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const demo = new PerformanceDemo();
            
            // Global access for debugging
            window.performanceDemo = demo;
            
            console.log('Mobile 120Hz Performance Demo loaded');
            console.log('Open DevTools to monitor performance metrics');
        });
    </script>
</body>
</html>
