<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 CSS Anchor + SVG连接线 - 实时跟随</title>
  
  <!-- CSS Anchor Positioning Polyfill -->
  <script src="https://unpkg.com/@oddbird/css-anchor-positioning"></script>
  
  <style>
    :root {
      --avatar-size: 50px;
      --connection-color: #ff3366;
      --connection-width: 2px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      /* 120Hz优化 */
      will-change: auto;
      transform: translate3d(0,0,0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* 性能监控 */
    .monitor {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    
    .monitor-value {
      color: #00ff66;
      font-weight: bold;
    }
    
    /* 主容器 - 三个横向滚动容器 */
    .main-container {
      display: flex;
      height: 80vh;
      margin-top: 80px;
      gap: 10px;
      padding: 0 10px;
      position: relative;
    }
    
    /* 三个滚动容器 */
    .scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 15px 10px;
      /* 硬件加速 */
      transform: translateZ(0);
      contain: layout style paint;
    }
    
    /* 第一个容器 - 会话头像(窄) */
    #chat-container {
      flex: 0 0 80px;
    }
    
    /* 第二个容器 - 消息气泡 */
    #message-container {
      flex: 1;
    }
    
    /* 第三个容器 - 账号头像(窄) */
    #account-container {
      flex: 0 0 80px;
    }
    
    /* 会话头像样式 - CSS Anchor */
    .chat-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      margin: 10px auto;
      font-size: 16px;
      /* CSS Anchor 锚点定义 - 用于位置获取 */
      anchor-name: var(--chat-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* 消息气泡样式 - CSS Anchor */
    .message-bubble {
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 12px 16px;
      margin: 10px 0;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid rgba(255,255,255,0.3);
      /* CSS Anchor 锚点定义 - 用于位置获取 */
      anchor-name: var(--bubble-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* 自己发送的消息气泡 */
    .message-bubble.self {
      background: rgba(0,255,100,0.3);
      border-color: rgba(0,255,100,0.5);
    }
    
    /* 账号头像样式 - CSS Anchor */
    .account-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      margin: 10px auto;
      font-size: 16px;
      /* CSS Anchor 锚点定义 - 用于位置获取 */
      anchor-name: var(--account-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* SVG连接线容器 - 覆盖整个区域 */
    .svg-connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    
    /* 隐藏的锚点获取辅助元素 */
    .anchor-helper {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    
    /* 气泡左侧中心锚点 */
    .bubble-left-center {
      left: anchor(var(--bubble-anchor) left);
      top: anchor(var(--bubble-anchor) center);
      transform: translateY(-50%);
    }
    
    /* 气泡右侧中心锚点 */  
    .bubble-right-center {
      left: anchor(var(--bubble-anchor) right);
      top: anchor(var(--bubble-anchor) center);
      transform: translateY(-50%);
    }
    
    /* 会话头像右侧中心锚点 */
    .chat-right-center {
      left: anchor(var(--chat-anchor) right);
      top: anchor(var(--chat-anchor) center);
      transform: translateY(-50%);
    }
    
    /* 账号头像左侧中心锚点 */
    .account-left-center {
      left: anchor(var(--account-anchor) left);
      top: anchor(var(--account-anchor) center);
      transform: translateY(-50%);
    }
    
    /* 控制按钮 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    
    .control-btn {
      padding: 10px 16px;
      background: rgba(0,0,0,0.8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .control-btn:hover {
      background: rgba(0,0,0,0.9);
    }
    
    /* 滚动条优化 */
    .scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    
    .scroll-container::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }
    
    /* 加载状态 */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 2000;
    }
    
    .loading-progress {
      width: 80%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 20px 0;
      overflow: hidden;
    }
    
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>
  <!-- 性能监控 -->
  <div class="monitor">
    <div>🔧 CSS Anchor + SVG</div>
    <div>FPS: <span id="fps" class="monitor-value">--</span></div>
    <div>连接线: <span id="connections" class="monitor-value">0</span></div>
    <div>状态: <span id="status" class="monitor-value">初始化</span></div>
  </div>

  <!-- 加载界面 -->
  <div id="loading" class="loading">
    <div style="font-size: 32px; margin-bottom: 20px;">🔧</div>
    <div style="font-size: 18px;">CSS Anchor + SVG</div>
    <div style="font-size: 14px; opacity: 0.8;">L型圆角连接线</div>
    <div class="loading-progress">
      <div id="loading-bar" class="loading-bar"></div>
    </div>
    <div id="loading-text">正在加载 Polyfill...</div>
  </div>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 会话头像容器(窄) -->
    <div id="chat-container" class="scroll-container">
      <div id="chat-content"></div>
    </div>
    
    <!-- 消息气泡容器 -->
    <div id="message-container" class="scroll-container">
      <div id="message-content"></div>
    </div>
    
    <!-- 账号头像容器(窄) -->
    <div id="account-container" class="scroll-container">
      <div id="account-content"></div>
    </div>
    
    <!-- SVG连接线容器 -->
    <svg id="svg-connections" class="svg-connections">
      <!-- 连接线将在这里动态生成 -->
    </svg>
    
    <!-- 锚点获取辅助容器 -->
    <div id="anchor-helpers"></div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button id="toggle-connections" class="control-btn">隐藏连接线</button>
    <button id="refresh-anchors" class="control-btn">刷新锚点</button>
    <button id="regenerate" class="control-btn">重新生成</button>
  </div>

  <script>
    class CSSAnchorSVGConnectionEngine {
      constructor() {
        this.connectionsVisible = true;
        this.polyfillReady = false;
        this.connectionCount = 0;
        this.elements = {
          chat: [],
          messages: [],
          accounts: []
        };
        this.anchorHelpers = [];
        this.svgPaths = [];
        
        this.init();
      }
      
      async init() {
        console.log('🔧 初始化 CSS Anchor + SVG 连接引擎...');
        
        // 等待 polyfill 加载
        await this.waitForPolyfill();
        
        // 生成测试元素
        await this.generateTestElements();
        
        // 创建锚点辅助元素
        this.createAnchorHelpers();
        
        // 创建SVG连接线
        await this.createSVGConnections();
        
        // 设置事件监听
        this.setupEventListeners();
        
        // 开始性能监控和实时更新
        this.startPerformanceMonitoring();
        this.startRealTimeUpdate();
        
        // 隐藏加载界面
        this.hideLoading();
        
        console.log('✅ CSS Anchor + SVG 连接引擎初始化完成');
      }
      
      async waitForPolyfill() {
        const maxAttempts = 100;
        let attempts = 0;
        
        while (attempts < maxAttempts) {
          // 检查原生支持或 polyfill
          if (window.CSS && window.CSS.supports && 
              window.CSS.supports('anchor-name', '--test')) {
            this.polyfillReady = true;
            document.getElementById('status').textContent = '原生支持';
            console.log('✅ CSS Anchor 原生支持');
            break;
          }
          
          // 检查 polyfill 是否加载
          if (typeof window.polyfillCSSAnchorPositioning === 'function') {
            this.polyfillReady = true;
            document.getElementById('status').textContent = 'Polyfill就绪';
            console.log('✅ CSS Anchor Polyfill 加载完成');
            
            // 初始化 polyfill
            setTimeout(() => {
              window.polyfillCSSAnchorPositioning();
            }, 100);
            break;
          }
          
          await new Promise(resolve => setTimeout(resolve, 100));
          attempts++;
        }
        
        if (!this.polyfillReady) {
          console.error('❌ CSS Anchor Polyfill 加载失败');
          document.getElementById('status').textContent = '加载失败';
        }
      }
      
      async generateTestElements() {
        const total = 20; // 先用少量元素测试
        const batchSize = 5;
        
        const chatContent = document.getElementById('chat-content');
        const messageContent = document.getElementById('message-content');
        const accountContent = document.getElementById('account-content');
        
        for (let batch = 0; batch < total / batchSize; batch++) {
          const start = batch * batchSize;
          const end = Math.min(start + batchSize, total);
          
          // 更新进度
          const progress = (end / total) * 100;
          document.getElementById('loading-bar').style.width = progress + '%';
          document.getElementById('loading-text').textContent = `生成元素 ${end}/${total}`;
          
          // 批量创建元素
          const chatFragment = document.createDocumentFragment();
          const messageFragment = document.createDocumentFragment();
          const accountFragment = document.createDocumentFragment();
          
          for (let i = start; i < end; i++) {
            const hue = (i * 137) % 360;
            const isSelf = i % 3 === 0; // 每3个消息有1个是自己发的
            
            // 会话头像
            const chatAvatar = document.createElement('div');
            chatAvatar.className = 'chat-avatar';
            chatAvatar.style.cssText = `
              --chat-anchor: --chat-${i};
              background: hsl(${hue}, 70%, 50%);
            `;
            chatAvatar.textContent = String.fromCharCode(65 + (i % 26));
            chatAvatar.setAttribute('data-index', i);
            chatFragment.appendChild(chatAvatar);
            this.elements.chat.push(chatAvatar);
            
            // 消息气泡
            const messageBubble = document.createElement('div');
            messageBubble.className = `message-bubble ${isSelf ? 'self' : ''}`;
            messageBubble.style.cssText = `
              --bubble-anchor: --bubble-${i};
              background: ${isSelf ? 'rgba(0,255,100,0.3)' : 'hsla('+hue+', 60%, 60%, 0.3)'};
            `;
            messageBubble.textContent = `${isSelf ? '我' : '用户'} ${i + 1}: 测试L型圆角连接线的实时跟随效果。`;
            messageBubble.setAttribute('data-index', i);
            messageBubble.setAttribute('data-sender', isSelf ? 'self' : 'other');
            messageFragment.appendChild(messageBubble);
            this.elements.messages.push(messageBubble);
            
            // 账号头像
            const accountAvatar = document.createElement('div');
            accountAvatar.className = 'account-avatar';
            accountAvatar.style.cssText = `
              --account-anchor: --account-${i};
              background: hsl(${(hue + 60) % 360}, 70%, 50%);
            `;
            accountAvatar.textContent = (i + 1).toString().padStart(2, '0');
            accountAvatar.setAttribute('data-index', i);
            accountFragment.appendChild(accountAvatar);
            this.elements.accounts.push(accountAvatar);
          }
          
          chatContent.appendChild(chatFragment);
          messageContent.appendChild(messageFragment);
          accountContent.appendChild(accountFragment);
          
          // 让UI有时间渲染
          await new Promise(resolve => setTimeout(resolve, 50));
        }
        
        console.log(`✅ 生成了 ${total} 个测试元素`);
      }
      
      createAnchorHelpers() {
        const helpersContainer = document.getElementById('anchor-helpers');
        helpersContainer.innerHTML = '';
        
        const total = this.elements.messages.length;
        
        for (let i = 0; i < total; i++) {
          const isSelf = this.elements.messages[i].getAttribute('data-sender') === 'self';
          
          // 气泡边缘中心锚点辅助元素
          const bubbleHelper = document.createElement('div');
          bubbleHelper.className = `anchor-helper ${isSelf ? 'bubble-right-center' : 'bubble-left-center'}`;
          bubbleHelper.style.cssText = `
            --bubble-anchor: --bubble-${i};
          `;
          bubbleHelper.setAttribute('data-type', isSelf ? 'bubble-right' : 'bubble-left');
          bubbleHelper.setAttribute('data-index', i);
          helpersContainer.appendChild(bubbleHelper);
          
          // 头像边缘中心锚点辅助元素
          if (isSelf) {
            // 自己的消息连接到账号头像左侧
            const accountHelper = document.createElement('div');
            accountHelper.className = 'anchor-helper account-left-center';
            accountHelper.style.cssText = `
              --account-anchor: --account-${i};
            `;
            accountHelper.setAttribute('data-type', 'account-left');
            accountHelper.setAttribute('data-index', i);
            helpersContainer.appendChild(accountHelper);
          } else {
            // 他人的消息连接到会话头像右侧
            const chatHelper = document.createElement('div');
            chatHelper.className = 'anchor-helper chat-right-center';
            chatHelper.style.cssText = `
              --chat-anchor: --chat-${i};
            `;
            chatHelper.setAttribute('data-type', 'chat-right');
            chatHelper.setAttribute('data-index', i);
            helpersContainer.appendChild(chatHelper);
          }
          
          this.anchorHelpers.push({
            bubble: bubbleHelper,
            avatar: isSelf ? helpersContainer.lastElementChild.previousElementSibling : helpersContainer.lastElementChild,
            isSelf,
            index: i
          });
        }
        
        console.log(`✅ 创建了 ${this.anchorHelpers.length} 组锚点辅助元素`);
      }
      
      async createSVGConnections() {
        const svg = document.getElementById('svg-connections');
        svg.innerHTML = '';
        
        // 强制 polyfill 重新计算位置
        if (typeof window.polyfillCSSAnchorPositioning === 'function') {
          window.polyfillCSSAnchorPositioning();
        }
        
        // 等待一帧确保位置计算完成
        await new Promise(resolve => requestAnimationFrame(resolve));
        
        this.svgPaths = [];
        
        for (let i = 0; i < this.anchorHelpers.length; i++) {
          const helper = this.anchorHelpers[i];
          const hue = (i * 137) % 360;
          const color = `hsl(${hue}, 80%, 60%)`;
          
          // 创建SVG路径元素
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('stroke', color);
          path.setAttribute('stroke-width', '2');
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke-linejoin', 'round');
          path.setAttribute('stroke-linecap', 'round');
          path.setAttribute('data-index', i);
          
          svg.appendChild(path);
          this.svgPaths.push(path);
        }
        
        // 初始更新连接线路径
        this.updateConnectionPaths();
        
        this.connectionCount = this.svgPaths.length;
        document.getElementById('connections').textContent = this.connectionCount;
        console.log(`✅ 创建了 ${this.connectionCount} 条SVG连接线`);
      }
      
      updateConnectionPaths() {
        for (let i = 0; i < this.anchorHelpers.length; i++) {
          const helper = this.anchorHelpers[i];
          const path = this.svgPaths[i];
          
          try {
            // 获取锚点位置
            const bubbleRect = helper.bubble.getBoundingClientRect();
            const avatarRect = helper.avatar.getBoundingClientRect();
            const containerRect = document.querySelector('.main-container').getBoundingClientRect();
            
            // 转换为相对于容器的坐标
            const bubbleX = bubbleRect.left - containerRect.left;
            const bubbleY = bubbleRect.top - containerRect.top;
            const avatarX = avatarRect.left - containerRect.left;
            const avatarY = avatarRect.top - containerRect.top;
            
            // 生成L型圆角路径
            const pathData = this.generateLShapePath(
              bubbleX, bubbleY,
              avatarX, avatarY,
              helper.isSelf
            );
            
            path.setAttribute('d', pathData);
          } catch (error) {
            console.warn(`更新连接线 ${i} 失败:`, error);
          }
        }
      }
      
      generateLShapePath(bubbleX, bubbleY, avatarX, avatarY, isSelf) {
        const cornerRadius = 3; // 圆角半径
        const horizontalExtend = 5; // 水平延伸5px
        
        let startX, startY, endX, endY;
        let firstCornerX, firstCornerY, secondCornerX, secondCornerY;
        
        if (isSelf) {
          // 自己的消息：从气泡右侧开始，连接到账号头像左侧
          startX = bubbleX;
          startY = bubbleY;
          endX = avatarX;
          endY = avatarY;
          
          // 第一段：向右延伸5px
          firstCornerX = startX + horizontalExtend;
          firstCornerY = startY;
          
          // 第二段：垂直到头像高度
          secondCornerX = firstCornerX;
          secondCornerY = endY;
          
        } else {
          // 他人的消息：从气泡左侧开始，连接到会话头像右侧
          startX = bubbleX;
          startY = bubbleY;
          endX = avatarX;
          endY = avatarY;
          
          // 第一段：向左延伸5px
          firstCornerX = startX - horizontalExtend;
          firstCornerY = startY;
          
          // 第二段：垂直到头像高度
          secondCornerX = firstCornerX;
          secondCornerY = endY;
        }
        
        // 生成带圆角的SVG路径
        const pathData = `
          M ${startX} ${startY}
          L ${firstCornerX - (isSelf ? cornerRadius : -cornerRadius)} ${firstCornerY}
          Q ${firstCornerX} ${firstCornerY} ${firstCornerX} ${firstCornerY + (endY > startY ? cornerRadius : -cornerRadius)}
          L ${secondCornerX} ${secondCornerY - (endY > startY ? cornerRadius : -cornerRadius)}
          Q ${secondCornerX} ${secondCornerY} ${secondCornerX + (isSelf ? -cornerRadius : cornerRadius)} ${secondCornerY}
          L ${endX} ${endY}
        `.replace(/\s+/g, ' ').trim();
        
        return pathData;
      }
      
      setupEventListeners() {
        // 切换连接线显示
        document.getElementById('toggle-connections').addEventListener('click', () => {
          this.connectionsVisible = !this.connectionsVisible;
          const svg = document.getElementById('svg-connections');
          svg.style.display = this.connectionsVisible ? 'block' : 'none';
          
          const btn = document.getElementById('toggle-connections');
          btn.textContent = this.connectionsVisible ? '隐藏连接线' : '显示连接线';
        });
        
        // 刷新锚点
        document.getElementById('refresh-anchors').addEventListener('click', () => {
          if (typeof window.polyfillCSSAnchorPositioning === 'function') {
            window.polyfillCSSAnchorPositioning();
            setTimeout(() => {
              this.updateConnectionPaths();
            }, 100);
            console.log('🔧 手动刷新锚点和连接线');
          }
        });
        
        // 重新生成
        document.getElementById('regenerate').addEventListener('click', async () => {
          await this.createSVGConnections();
          console.log('🔄 重新生成连接线');
        });
        
        // 滚动时自动更新连接线
        const containers = document.querySelectorAll('.scroll-container');
        containers.forEach(container => {
          container.addEventListener('scroll', () => {
            if (typeof window.polyfillCSSAnchorPositioning === 'function') {
              window.polyfillCSSAnchorPositioning();
            }
            requestAnimationFrame(() => {
              this.updateConnectionPaths();
            });
          });
        });
      }
      
      startRealTimeUpdate() {
        // 定期更新连接线位置
        const updateLoop = () => {
          if (this.connectionsVisible) {
            this.updateConnectionPaths();
          }
          requestAnimationFrame(updateLoop);
        };
        updateLoop();
      }
      
      startPerformanceMonitoring() {
        let frameCount = 0;
        let lastTime = performance.now();
        
        const updateFPS = () => {
          frameCount++;
          const now = performance.now();
          
          if (now - lastTime >= 1000) {
            const fps = Math.round(frameCount * 1000 / (now - lastTime));
            document.getElementById('fps').textContent = fps;
            
            frameCount = 0;
            lastTime = now;
          }
          
          requestAnimationFrame(updateFPS);
        };
        
        updateFPS();
      }
      
      hideLoading() {
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      }
    }
    
    // 启动应用
    document.addEventListener('DOMContentLoaded', () => {
      new CSSAnchorSVGConnectionEngine();
    });
  </script>
</body>
</html>
