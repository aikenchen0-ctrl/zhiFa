<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 CSS Anchor Positioning - 实时跟随连接线</title>
  
  <!-- CSS Anchor Positioning Polyfill -->
  <script src="https://unpkg.com/@oddbird/css-anchor-positioning"></script>
  
  <style>
    :root {
      --avatar-size: 50px;
      --connection-color: #3b82f6;
      --connection-width: 2px;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
      /* 120Hz优化 */
      will-change: auto;
      transform: translate3d(0,0,0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    
    /* 性能监控 */
    .monitor {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }
    
    .monitor-value {
      color: #00ff66;
      font-weight: bold;
    }
    
    /* 主容器 - 三个横向滚动容器 */
    .main-container {
      display: flex;
      height: 80vh;
      margin-top: 80px;
      gap: 10px;
      padding: 0 10px;
      position: relative;
    }
    
    /* 三个滚动容器 */
    .scroll-container {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 15px 10px;
      /* 硬件加速 */
      transform: translateZ(0);
      contain: layout style paint;
    }
    
    /* 第一个容器 - 会话头像(窄) */
    #chat-container {
      flex: 0 0 80px;
    }
    
    /* 第二个容器 - 消息气泡 */
    #message-container {
      flex: 1;
    }
    
    /* 第三个容器 - 账号头像(窄) */
    #account-container {
      flex: 0 0 80px;
    }
    
    /* 会话头像样式 - CSS Anchor */
    .chat-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      margin: 10px auto;
      font-size: 16px;
      /* CSS Anchor 锚点定义 */
      anchor-name: var(--chat-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* 消息气泡样式 - CSS Anchor */
    .message-bubble {
      background: rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 12px 16px;
      margin: 10px 0;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid rgba(255,255,255,0.3);
      /* CSS Anchor 锚点定义 */
      anchor-name: var(--bubble-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* 账号头像样式 - CSS Anchor */
    .account-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      margin: 10px auto;
      font-size: 16px;
      /* CSS Anchor 锚点定义 */
      anchor-name: var(--account-anchor);
      /* 性能优化 */
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    
    /* 连接线容器 */
    .connection-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    
    /* 连接线1: 会话头像 → 消息气泡 */
    .connection-chat-to-bubble {
      position: absolute;
      /* CSS Anchor Positioning 实时定位 */
      left: anchor(var(--chat-anchor) right);
      top: anchor(var(--chat-anchor) center);
      width: anchor(var(--bubble-anchor) left);
      height: var(--connection-width);
      background: var(--connection-color);
      transform: translateY(-50%);
      /* 性能优化 */
      will-change: left, top, width;
      contain: layout style paint;
    }
    
    /* 连接线2: 消息气泡 → 账号头像 */
    .connection-bubble-to-account {
      position: absolute;
      /* CSS Anchor Positioning 实时定位 */
      left: anchor(var(--bubble-anchor) right);
      top: anchor(var(--bubble-anchor) center);
      width: anchor(var(--account-anchor) left);
      height: var(--connection-width);
      background: var(--connection-color);
      transform: translateY(-50%);
      /* 性能优化 */
      will-change: left, top, width;
      contain: layout style paint;
    }
    
    /* L型连接线实现 */
    .connection-l-shape {
      position: absolute;
    }
    
    /* 水平线段 */
    .connection-l-shape::before {
      content: '';
      position: absolute;
      height: var(--connection-width);
      background: var(--connection-color);
      border-radius: 1px;
    }
    
    /* 垂直线段 */
    .connection-l-shape::after {
      content: '';
      position: absolute;
      width: var(--connection-width);
      background: var(--connection-color);
      border-radius: 1px;
    }
    
    /* 会话到气泡的L型连接 */
    .l-chat-to-bubble::before {
      left: anchor(var(--chat-anchor) right);
      top: anchor(var(--chat-anchor) center);
      width: calc(anchor(var(--bubble-anchor) left) - anchor(var(--chat-anchor) right));
      transform: translateY(-50%);
    }
    
    .l-chat-to-bubble::after {
      left: anchor(var(--bubble-anchor) left);
      top: min(anchor(var(--chat-anchor) center), anchor(var(--bubble-anchor) center));
      height: abs(anchor(var(--bubble-anchor) center) - anchor(var(--chat-anchor) center));
      transform: translateX(-50%);
    }
    
    /* 气泡到账号的L型连接 */
    .l-bubble-to-account::before {
      left: anchor(var(--bubble-anchor) right);
      top: anchor(var(--bubble-anchor) center);
      width: calc(anchor(var(--account-anchor) left) - anchor(var(--bubble-anchor) right));
      transform: translateY(-50%);
    }
    
    .l-bubble-to-account::after {
      left: anchor(var(--account-anchor) left);
      top: min(anchor(var(--bubble-anchor) center), anchor(var(--account-anchor) center));
      height: abs(anchor(var(--account-anchor) center) - anchor(var(--bubble-anchor) center));
      transform: translateX(-50%);
    }
    
    /* 控制按钮 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    
    .control-btn {
      padding: 10px 16px;
      background: rgba(0,0,0,0.8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .control-btn:hover {
      background: rgba(0,0,0,0.9);
    }
    
    /* 滚动条优化 */
    .scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    
    .scroll-container::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }
    
    /* 加载状态 */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 2000;
    }
    
    .loading-progress {
      width: 80%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 20px 0;
      overflow: hidden;
    }
    
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>
  <!-- 性能监控 -->
  <div class="monitor">
    <div>🔧 CSS Anchor + Polyfill</div>
    <div>FPS: <span id="fps" class="monitor-value">--</span></div>
    <div>连接线: <span id="connections" class="monitor-value">0</span></div>
    <div>状态: <span id="status" class="monitor-value">初始化</span></div>
  </div>

  <!-- 加载界面 -->
  <div id="loading" class="loading">
    <div style="font-size: 32px; margin-bottom: 20px;">🔧</div>
    <div style="font-size: 18px;">CSS Anchor Positioning</div>
    <div style="font-size: 14px; opacity: 0.8;">实时跟随连接线</div>
    <div class="loading-progress">
      <div id="loading-bar" class="loading-bar"></div>
    </div>
    <div id="loading-text">正在加载 Polyfill...</div>
  </div>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 会话头像容器(窄) -->
    <div id="chat-container" class="scroll-container">
      <div id="chat-content"></div>
    </div>
    
    <!-- 消息气泡容器 -->
    <div id="message-container" class="scroll-container">
      <div id="message-content"></div>
    </div>
    
    <!-- 账号头像容器(窄) -->
    <div id="account-container" class="scroll-container">
      <div id="account-content"></div>
    </div>
    
    <!-- 连接线容器 -->
    <div id="connection-container" class="connection-container"></div>
  </div>

  <!-- 控制按钮 -->
  <div class="controls">
    <button id="toggle-connections" class="control-btn">隐藏连接线</button>
    <button id="refresh-anchors" class="control-btn">刷新锚点</button>
    <button id="toggle-l-shape" class="control-btn">切换L型</button>
  </div>

  <script>
    class CSSAnchorConnectionEngine {
      constructor() {
        this.connectionsVisible = true;
        this.lShapeMode = false;
        this.polyfillReady = false;
        this.connectionCount = 0;
        this.elements = {
          chat: [],
          messages: [],
          accounts: []
        };
        
        this.init();
      }
      
      async init() {
        console.log('🔧 初始化 CSS Anchor 连接引擎...');
        
        // 等待 polyfill 加载
        await this.waitForPolyfill();
        
        // 生成测试元素
        await this.generateTestElements();
        
        // 创建连接线
        this.createConnections();
        
        // 设置事件监听
        this.setupEventListeners();
        
        // 开始性能监控
        this.startPerformanceMonitoring();
        
        // 隐藏加载界面
        this.hideLoading();
        
        console.log('✅ CSS Anchor 连接引擎初始化完成');
      }
      
      async waitForPolyfill() {
        const maxAttempts = 100;
        let attempts = 0;
        
        while (attempts < maxAttempts) {
          // 检查原生支持或 polyfill
          if (window.CSS && window.CSS.supports && 
              window.CSS.supports('anchor-name', '--test')) {
            this.polyfillReady = true;
            document.getElementById('status').textContent = '原生支持';
            console.log('✅ CSS Anchor 原生支持');
            break;
          }
          
          // 检查 polyfill 是否加载
          if (typeof window.polyfillCSSAnchorPositioning === 'function') {
            this.polyfillReady = true;
            document.getElementById('status').textContent = 'Polyfill就绪';
            console.log('✅ CSS Anchor Polyfill 加载完成');
            
            // 初始化 polyfill
            window.polyfillCSSAnchorPositioning();
            break;
          }
          
          await new Promise(resolve => setTimeout(resolve, 100));
          attempts++;
        }
        
        if (!this.polyfillReady) {
          console.error('❌ CSS Anchor Polyfill 加载失败');
          document.getElementById('status').textContent = '加载失败';
        }
      }
      
      async generateTestElements() {
        const total = 1000;
        const batchSize = 50;
        
        const chatContent = document.getElementById('chat-content');
        const messageContent = document.getElementById('message-content');
        const accountContent = document.getElementById('account-content');
        
        for (let batch = 0; batch < total / batchSize; batch++) {
          const start = batch * batchSize;
          const end = Math.min(start + batchSize, total);
          
          // 更新进度
          const progress = (end / total) * 100;
          document.getElementById('loading-bar').style.width = progress + '%';
          document.getElementById('loading-text').textContent = `生成元素 ${end}/${total}`;
          
          // 批量创建元素
          const chatFragment = document.createDocumentFragment();
          const messageFragment = document.createDocumentFragment();
          const accountFragment = document.createDocumentFragment();
          
          for (let i = start; i < end; i++) {
            const hue = (i * 137) % 360;
            
            // 会话头像
            const chatAvatar = document.createElement('div');
            chatAvatar.className = 'chat-avatar';
            chatAvatar.style.cssText = `
              --chat-anchor: --chat-${i};
              background: hsl(${hue}, 70%, 50%);
            `;
            chatAvatar.textContent = String.fromCharCode(65 + (i % 26));
            chatFragment.appendChild(chatAvatar);
            this.elements.chat.push(chatAvatar);
            
            // 消息气泡
            const messageBubble = document.createElement('div');
            messageBubble.className = 'message-bubble';
            messageBubble.style.cssText = `
              --bubble-anchor: --bubble-${i};
              background: hsla(${hue}, 60%, 60%, 0.3);
            `;
            messageBubble.textContent = `这是第${i + 1}条消息内容，用于测试CSS Anchor连接线的实时跟随效果。`;
            messageFragment.appendChild(messageBubble);
            this.elements.messages.push(messageBubble);
            
            // 账号头像
            const accountAvatar = document.createElement('div');
            accountAvatar.className = 'account-avatar';
            accountAvatar.style.cssText = `
              --account-anchor: --account-${i};
              background: hsl(${(hue + 60) % 360}, 70%, 50%);
            `;
            accountAvatar.textContent = (i + 1).toString().padStart(2, '0');
            accountFragment.appendChild(accountAvatar);
            this.elements.accounts.push(accountAvatar);
          }
          
          chatContent.appendChild(chatFragment);
          messageContent.appendChild(messageFragment);
          accountContent.appendChild(accountFragment);
          
          // 让UI有时间渲染
          await new Promise(resolve => setTimeout(resolve, 10));
        }
        
        console.log(`✅ 生成了 ${total} 个测试元素`);
      }
      
      createConnections() {
        const connectionContainer = document.getElementById('connection-container');
        connectionContainer.innerHTML = '';
        
        const total = this.elements.chat.length;
        const fragment = document.createDocumentFragment();
        
        for (let i = 0; i < total; i++) {
          const hue = (i * 137) % 360;
          const connectionColor = `hsl(${hue}, 70%, 55%)`;
          
          if (this.lShapeMode) {
            // L型连接线
            const chatToBubbleL = document.createElement('div');
            chatToBubbleL.className = 'connection-l-shape l-chat-to-bubble';
            chatToBubbleL.style.cssText = `
              --chat-anchor: --chat-${i};
              --bubble-anchor: --bubble-${i};
              --connection-color: ${connectionColor};
            `;
            fragment.appendChild(chatToBubbleL);
            
            const bubbleToAccountL = document.createElement('div');
            bubbleToAccountL.className = 'connection-l-shape l-bubble-to-account';
            bubbleToAccountL.style.cssText = `
              --bubble-anchor: --bubble-${i};
              --account-anchor: --account-${i};
              --connection-color: ${connectionColor};
            `;
            fragment.appendChild(bubbleToAccountL);
            
            this.connectionCount += 2;
          } else {
            // 直线连接
            const chatToBubble = document.createElement('div');
            chatToBubble.className = 'connection-chat-to-bubble';
            chatToBubble.style.cssText = `
              --chat-anchor: --chat-${i};
              --bubble-anchor: --bubble-${i};
              --connection-color: ${connectionColor};
            `;
            fragment.appendChild(chatToBubble);
            
            const bubbleToAccount = document.createElement('div');
            bubbleToAccount.className = 'connection-bubble-to-account';
            bubbleToAccount.style.cssText = `
              --bubble-anchor: --bubble-${i};
              --account-anchor: --account-${i};
              --connection-color: ${connectionColor};
            `;
            fragment.appendChild(bubbleToAccount);
            
            this.connectionCount += 2;
          }
        }
        
        connectionContainer.appendChild(fragment);
        
        // 强制 polyfill 重新计算
        if (typeof window.polyfillCSSAnchorPositioning === 'function') {
          requestAnimationFrame(() => {
            window.polyfillCSSAnchorPositioning();
          });
        }
        
        document.getElementById('connections').textContent = this.connectionCount;
        console.log(`✅ 创建了 ${this.connectionCount} 条连接线`);
      }
      
      setupEventListeners() {
        // 切换连接线显示
        document.getElementById('toggle-connections').addEventListener('click', () => {
          this.connectionsVisible = !this.connectionsVisible;
          const container = document.getElementById('connection-container');
          container.style.display = this.connectionsVisible ? 'block' : 'none';
          
          const btn = document.getElementById('toggle-connections');
          btn.textContent = this.connectionsVisible ? '隐藏连接线' : '显示连接线';
        });
        
        // 刷新锚点
        document.getElementById('refresh-anchors').addEventListener('click', () => {
          if (typeof window.polyfillCSSAnchorPositioning === 'function') {
            window.polyfillCSSAnchorPositioning();
            console.log('🔧 手动刷新锚点');
          }
        });
        
        // 切换L型模式
        document.getElementById('toggle-l-shape').addEventListener('click', () => {
          this.lShapeMode = !this.lShapeMode;
          this.connectionCount = 0;
          this.createConnections();
          
          const btn = document.getElementById('toggle-l-shape');
          btn.textContent = this.lShapeMode ? '直线模式' : 'L型模式';
        });
        
        // 滚动时自动刷新锚点（为了确保实时跟随）
        const containers = document.querySelectorAll('.scroll-container');
        containers.forEach(container => {
          container.addEventListener('scroll', () => {
            if (typeof window.polyfillCSSAnchorPositioning === 'function') {
              window.polyfillCSSAnchorPositioning();
            }
          });
        });
      }
      
      startPerformanceMonitoring() {
        let frameCount = 0;
        let lastTime = performance.now();
        
        const updateFPS = () => {
          frameCount++;
          const now = performance.now();
          
          if (now - lastTime >= 1000) {
            const fps = Math.round(frameCount * 1000 / (now - lastTime));
            document.getElementById('fps').textContent = fps;
            
            frameCount = 0;
            lastTime = now;
          }
          
          requestAnimationFrame(updateFPS);
        };
        
        updateFPS();
      }
      
      hideLoading() {
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
        }, 300);
      }
    }
    
    // 启动应用
    document.addEventListener('DOMContentLoaded', () => {
      new CSSAnchorConnectionEngine();
    });
  </script>
</body>
</html>
