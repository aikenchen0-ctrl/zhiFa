<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 移动端120Hz优化版本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --connection-width: 2px;
      --corner-radius: 6px;
      --avatar-size: 40px;
      --bubble-padding: 8px 12px;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
      /* 120Hz优化 */
      will-change: auto;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    
    .glass {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    
    /* 移动端横向容器布局 - 120Hz优化 */
    .mobile-container-wrapper {
      display: flex;
      gap: 8px;
      height: 65vh;
      padding: 0 8px;
    }
    
    .mobile-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      position: relative;
      /* 硬件加速 */
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      will-change: scroll-position;
    }
    
    .scroll-content {
      padding: 10px;
      /* 动态高度，由JavaScript计算 */
    }
    
    /* 优化的头像样式 - 120Hz优化 */
    .chat-avatar, .account-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      margin: 8px auto;
      font-size: 12px;
      position: relative;
      flex-shrink: 0;
      /* 硬件加速 */
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }
    
    /* 优化的气泡样式 - 120Hz优化 */
    .message-bubble {
      max-width: 90%;
      padding: var(--bubble-padding);
      border-radius: 10px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      margin: 8px auto;
      font-size: 12px;
      line-height: 1.3;
      position: relative;
      flex-shrink: 0;
      /* 硬件加速 */
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }
    
    .bubble-other {
      background: rgba(156, 163, 175, 0.25);
      border: 1px solid rgba(156, 163, 175, 0.4);
      margin-left: 10px;
      margin-right: auto;
    }
    
    .bubble-self {
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      margin-right: 10px;
      margin-left: auto;
    }
    
    /* Canvas优化 - 120Hz设计 */
    #performanceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
      /* 120Hz硬件加速优化 */
      will-change: transform;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
    }
    
    /* 性能监控面板 */
    .perf-monitor {
      position: fixed;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 10px;
      z-index: 1000;
      max-width: 140px;
      backdrop-filter: blur(10px);
    }
    
    .perf-value {
      color: #ffff00;
      font-weight: bold;
    }
    
    .perf-warning {
      color: #ff6666;
      font-weight: bold;
    }
    
    .perf-excellent {
      color: #00ff66;
      font-weight: bold;
    }
    
    /* 控制面板 */
    .control-panel {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    
    .control-btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 60px;
      text-align: center;
    }
    
    /* 加载状态 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      color: white;
    }
    
    .loading-progress {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 20px 0;
      overflow: hidden;
    }
    
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s;
    }
    
    /* 调试模式 */
    .debug-mode .chat-avatar,
    .debug-mode .account-avatar { 
      outline: 1px solid rgba(0, 255, 0, 0.8);
    }
    
    .debug-mode .message-bubble { 
      outline: 1px solid rgba(255, 0, 0, 0.8);
    }
    
    /* 滚动优化 - 120Hz */
    .mobile-container::-webkit-scrollbar {
      width: 3px;
    }
    
    .mobile-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    
    .mobile-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }
    
    /* 120Hz优化 - 减少重绘 */
    .mobile-container {
      contain: layout style paint;
    }
    
    .scroll-content {
      contain: layout style;
    }
  </style>
</head>
<body>
  
  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="font-size: 24px; margin-bottom: 10px;">🚀</div>
    <div>正在生成1000个元素...</div>
    <div class="loading-progress">
      <div id="loadingBar" class="loading-bar"></div>
    </div>
    <div id="loadingText">初始化中...</div>
  </div>
  
  <!-- 性能监控面板 -->
  <div id="perfMonitor" class="perf-monitor">
    <div>📱 120Hz优化版</div>
    <div>FPS: <span id="fps" class="perf-value">--</span></div>
    <div>帧时: <span id="frameTime" class="perf-value">--</span>ms</div>
    <div>目标: <span id="targetFps" class="perf-value">120</span>Hz</div>
    <div>连接: <span id="connectionCount" class="perf-value">0</span></div>
    <div>内存: <span id="memoryUsage" class="perf-value">--</span>MB</div>
    <div>状态: <span id="systemStatus" class="perf-value">准备中</span></div>
  </div>

  <!-- 控制面板 -->
  <div class="control-panel">
    <button id="toggleRender" class="control-btn" style="background: #ef4444;">
      ⏸️ 暂停
    </button>
    <button id="toggleDebug" class="control-btn" style="background: #6b7280;">
      🔍 调试
    </button>
    <button id="refresh120Hz" class="control-btn" style="background: #10b981;">
      💎 120Hz
    </button>
    <button id="resetTest" class="control-btn" style="background: #3b82f6;">
      🔄 重置
    </button>
  </div>

  <div class="p-2">
    
    <!-- 标题 -->
    <div class="text-center mb-4 pt-2">
      <h1 class="text-xl font-bold text-white mb-1">📱 120Hz优化版本</h1>
      <p class="text-white/80 text-sm">1000连接线 • 横向布局 • 适度优化</p>
    </div>

    <!-- 三个横向排列的容器 -->
    <div class="mobile-container-wrapper">
      
      <!-- 容器1：会话头像 -->
      <div class="glass mobile-container" id="chatAvatarContainer">
        <div class="scroll-content" id="chatAvatarContent">
          <!-- 动态生成1000个会话头像 -->
        </div>
      </div>

      <!-- 容器2：消息气泡 -->
      <div class="glass mobile-container" id="messageBubbleContainer">
        <div class="scroll-content" id="messageBubbleContent">
          <!-- 动态生成1000个消息气泡 -->
        </div>
      </div>

      <!-- 容器3：账号头像 -->
      <div class="glass mobile-container" id="accountAvatarContainer">
        <div class="scroll-content" id="accountAvatarContent">
          <!-- 动态生成1000个账号头像 -->
        </div>
      </div>

    </div>

  </div>

  <!-- 高性能Canvas -->
  <canvas id="performanceCanvas"></canvas>
  
  <script>
    // 120Hz优化连接引擎
    class HighPerformance120HzEngine {
      constructor() {
        this.canvas = null;
        this.ctx = null;
        this.connections = [];
        this.enabled = true;
        this.debugMode = false;
        this.animationId = null;
        
        // 120Hz优化参数
        this.targetFPS = 120;
        this.frameInterval = 1000 / this.targetFPS; // 8.33ms
        this.lastFrameTime = 0;
        this.frameCounter = 0;
        
        // 适度优化参数（不过度限制）
        this.renderEveryFrame = true; // 始终渲染，确保连接线显示
        this.lastPositionsCache = new Map();
        
        this.init();
      }
      
      async init() {
        this.canvas = document.getElementById('performanceCanvas');
        if (!this.canvas) return;
        
        // 120Hz优化的Canvas上下文
        this.ctx = this.canvas.getContext('2d', {
          alpha: true,
          desynchronized: true, // 120Hz关键优化
          powerPreference: 'high-performance',
          antialias: false, // 减少GPU负担
          willReadFrequently: false
        });
        
        this.resizeCanvas();
        
        window.addEventListener('resize', () => {
          this.resizeCanvas();
        });
        
        this.log('✅ 120Hz优化Canvas初始化完成');
      }
      
      resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制DPR避免过度渲染
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        
        this.ctx.scale(dpr, dpr);
        
        // 120Hz优化：设置绘制质量
        this.ctx.imageSmoothingEnabled = false;
      }
      
      createConnections(count) {
        this.connections = [];
        
        for (let i = 0; i < count; i++) {
          const chatAvatar = document.querySelector(`[data-connection="chat-avatar-${i}"]`);
          const bubble = document.querySelector(`[data-connection="bubble-${i}"]`);
          const accountAvatar = document.querySelector(`[data-connection="account-avatar-${i}"]`);
          
          if (chatAvatar && bubble && accountAvatar) {
            this.connections.push({
              id: i,
              chatAvatar: chatAvatar,
              bubble: bubble,
              accountAvatar: accountAvatar,
              type: i % 3 === 2 ? 'self' : 'other',
              color: this.getConnectionColor(i),
              lastVisible: true
            });
          }
        }
        
        document.getElementById('connectionCount').textContent = this.connections.length;
        this.log(`🔗 创建了 ${this.connections.length} 个连接`);
      }
      
      getConnectionColor(index) {
        const hue = (index * 137) % 360;
        return `hsl(${hue}, 65%, 55%)`;
      }
      
      startRendering() {
        const render = (currentTime) => {
          if (!this.enabled) return;
          
          // 120Hz帧率控制（适度控制，不过度限制）
          if (currentTime - this.lastFrameTime >= this.frameInterval * 0.8) { // 允许10-15%波动
            this.renderFrame();
            this.lastFrameTime = currentTime;
          }
          
          this.animationId = requestAnimationFrame(render);
        };
        
        render(performance.now());
      }
      
      renderFrame() {
        // 清除画布
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 渲染所有连接线（确保始终显示）
        this.connections.forEach(connection => {
          this.drawLShapedConnection(connection);
        });
        
        this.frameCounter++;
      }
      
      drawLShapedConnection(connection) {
        // 使用位置缓存优化（但不影响基本显示）
        const cacheKey = connection.id;
        const bubbleRect = connection.bubble.getBoundingClientRect();
        const targetRect = connection.type === 'self' ? 
          connection.accountAvatar.getBoundingClientRect() :
          connection.chatAvatar.getBoundingClientRect();
        
        if (!bubbleRect.width || !targetRect.width) return;
        
        // 简单的位置变化检测
        const positionHash = `${bubbleRect.left.toFixed(0)},${bubbleRect.top.toFixed(0)},${targetRect.left.toFixed(0)},${targetRect.top.toFixed(0)}`;
        const lastHash = this.lastPositionsCache.get(cacheKey);
        
        if (positionHash !== lastHash) {
          this.lastPositionsCache.set(cacheKey, positionHash);
        }
        
        const bubbleCenterY = bubbleRect.top + bubbleRect.height / 2;
        const targetCenterY = targetRect.top + targetRect.height / 2;
        
        let startX, startY, endX, endY;
        const extension = 5;
        
        if (connection.type === 'self') {
          startX = bubbleRect.right;
          startY = bubbleCenterY;
          endX = targetRect.left;
          endY = targetCenterY;
        } else {
          startX = bubbleRect.left;
          startY = bubbleCenterY;
          endX = targetRect.right;
          endY = targetCenterY;
        }
        
        // 优化的L型路径绘制（保证连接线显示）
        this.ctx.beginPath();
        this.ctx.strokeStyle = connection.color;
        this.ctx.lineWidth = 2;
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';
        
        const midX = connection.type === 'self' ? startX + extension : startX - extension;
        
        // 绘制L型路径
        this.ctx.moveTo(startX, startY);
        this.ctx.lineTo(midX, startY);
        this.ctx.lineTo(midX, endY);
        this.ctx.lineTo(endX, endY);
        
        this.ctx.stroke();
        
        // 调试模式：显示关键点
        if (this.debugMode && connection.id % 100 === 0) { // 减少调试点数量
          this.drawDebugPoint(startX, startY, '#ff4444');
          this.drawDebugPoint(endX, endY, '#44ff44');
        }
      }
      
      drawDebugPoint(x, y, color) {
        this.ctx.beginPath();
        this.ctx.fillStyle = color;
        this.ctx.arc(x, y, 3, 0, 2 * Math.PI);
        this.ctx.fill();
      }
      
      toggle() {
        this.enabled = !this.enabled;
        
        if (!this.enabled) {
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
          }
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          document.getElementById('systemStatus').textContent = '暂停';
          document.getElementById('systemStatus').className = 'perf-warning';
        } else {
          this.startRendering();
          document.getElementById('systemStatus').textContent = '120Hz运行';
          document.getElementById('systemStatus').className = 'perf-excellent';
        }
        
        this.log(`🎨 连接线渲染: ${this.enabled ? '启用' : '暂停'}`);
      }
      
      setDebugMode(enabled) {
        this.debugMode = enabled;
        document.body.classList.toggle('debug-mode', enabled);
        this.log(`🔍 调试模式: ${enabled ? '启用' : '禁用'}`);
      }
      
      optimize120Hz() {
        // 120Hz优化措施
        this.targetFPS = 120;
        this.frameInterval = 1000 / this.targetFPS;
        
        // 清理缓存
        this.lastPositionsCache.clear();
        
        document.getElementById('targetFps').textContent = '120';
        this.log('💎 120Hz优化已激活');
      }
      
      log(message) {
        console.log(`[120Hz引擎] ${message}`);
      }
    }
    
    // 性能监控器 - 120Hz版本
    class Performance120HzMonitor {
      constructor() {
        this.frameCount = 0;
        this.lastTime = performance.now();
        this.fps = 0;
        this.frameTime = 0;
        this.refreshRate = this.detectRefreshRate();
        
        this.updateInterval = setInterval(() => {
          this.updateMemoryUsage();
        }, 2000);
        
        document.getElementById('targetFps').textContent = this.refreshRate;
      }
      
      detectRefreshRate() {
        // 简单的刷新率检测
        if (window.screen && window.screen.getScreenDetails) {
          // 新的Screen API（实验性）
          return 120;
        }
        
        // 回退到默认120Hz
        return 120;
      }
      
      update() {
        this.frameCount++;
        const now = performance.now();
        
        if (now - this.lastTime >= 1000) {
          this.fps = Math.round(this.frameCount * 1000 / (now - this.lastTime));
          this.frameTime = Math.round((now - this.lastTime) / this.frameCount * 100) / 100;
          
          document.getElementById('fps').textContent = this.fps;
          document.getElementById('frameTime').textContent = this.frameTime;
          
          // 120Hz性能评级
          if (this.fps >= 90) {
            document.getElementById('fps').className = 'perf-excellent';
          } else if (this.fps >= 60) {
            document.getElementById('fps').className = 'perf-value';
          } else {
            document.getElementById('fps').className = 'perf-warning';
          }
          
          this.frameCount = 0;
          this.lastTime = now;
        }
      }
      
      updateMemoryUsage() {
        if (performance.memory) {
          const used = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
          document.getElementById('memoryUsage').textContent = used;
          
          if (used > 150) {
            document.getElementById('memoryUsage').className = 'perf-warning';
          } else {
            document.getElementById('memoryUsage').className = 'perf-value';
          }
        }
      }
    }
    
    // 主应用控制器
    class Mobile120HzApp {
      constructor() {
        this.connectionEngine = new HighPerformance120HzEngine();
        this.perfMonitor = new Performance120HzMonitor();
        this.elementsGenerated = false;
        
        this.setupEventListeners();
        this.generateElements();
      }
      
      setupEventListeners() {
        document.getElementById('toggleRender').addEventListener('click', () => {
          this.connectionEngine.toggle();
          this.updateRenderButton();
        });
        
        document.getElementById('toggleDebug').addEventListener('click', () => {
          const enabled = document.body.classList.contains('debug-mode');
          this.connectionEngine.setDebugMode(!enabled);
          this.updateDebugButton();
        });
        
        document.getElementById('refresh120Hz').addEventListener('click', () => {
          this.connectionEngine.optimize120Hz();
        });
        
        document.getElementById('resetTest').addEventListener('click', () => {
          this.resetTest();
        });
      }
      
      async generateElements() {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingBar = document.getElementById('loadingBar');
        const loadingText = document.getElementById('loadingText');
        
        const count = 1000;
        const batchSize = 50;
        
        for (let batch = 0; batch < count / batchSize; batch++) {
          const start = batch * batchSize;
          const end = Math.min(start + batchSize, count);
          
          const progress = (end / count) * 100;
          loadingBar.style.width = progress + '%';
          loadingText.textContent = `生成元素 ${end}/${count}`;
          
          await this.generateBatch(start, end);
          await new Promise(resolve => setTimeout(resolve, 8)); // 减少等待时间
        }
        
        this.setContainerHeights(count);
        
        loadingText.textContent = '创建连接线...';
        await new Promise(resolve => setTimeout(resolve, 100));
        this.connectionEngine.createConnections(count);
        
        this.connectionEngine.startRendering();
        this.startPerformanceMonitoring();
        
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 300);
        
        document.getElementById('systemStatus').textContent = '120Hz就绪';
        document.getElementById('systemStatus').className = 'perf-excellent';
        this.elementsGenerated = true;
        
        console.log('🚀 120Hz优化版本启动完成');
      }
      
      async generateBatch(start, end) {
        const chatContainer = document.getElementById('chatAvatarContent');
        const bubbleContainer = document.getElementById('messageBubbleContent');
        const accountContainer = document.getElementById('accountAvatarContent');
        
        for (let i = start; i < end; i++) {
          // 会话头像
          const chatAvatar = document.createElement('div');
          chatAvatar.className = 'chat-avatar';
          chatAvatar.style.background = `hsl(${(i * 137) % 360}, 70%, 50%)`;
          chatAvatar.setAttribute('data-connection', `chat-avatar-${i}`);
          chatAvatar.textContent = String.fromCharCode(65 + (i % 26));
          chatContainer.appendChild(chatAvatar);
          
          // 消息气泡
          const bubble = document.createElement('div');
          const isSelf = i % 3 === 2;
          bubble.className = `message-bubble ${isSelf ? 'bubble-self' : 'bubble-other'}`;
          bubble.setAttribute('data-connection', `bubble-${i}`);
          bubble.setAttribute('data-type', isSelf ? 'self' : 'other');
          bubble.textContent = `消息 ${i + 1} ${isSelf ? '(我)' : '(对方)'}`;
          bubbleContainer.appendChild(bubble);
          
          // 账号头像
          const accountAvatar = document.createElement('div');
          accountAvatar.className = 'account-avatar';
          accountAvatar.style.background = `hsl(${(i * 137 + 30) % 360}, 70%, 45%)`;
          accountAvatar.setAttribute('data-connection', `account-avatar-${i}`);
          accountAvatar.textContent = String.fromCharCode(65 + (i % 26));
          accountContainer.appendChild(accountAvatar);
        }
      }
      
      setContainerHeights(count) {
        const avatarHeight = 56;
        const bubbleHeight = 56;
        
        document.getElementById('chatAvatarContent').style.height = (count * avatarHeight) + 'px';
        document.getElementById('messageBubbleContent').style.height = (count * bubbleHeight) + 'px';
        document.getElementById('accountAvatarContent').style.height = (count * avatarHeight) + 'px';
      }
      
      updateRenderButton() {
        const btn = document.getElementById('toggleRender');
        const enabled = this.connectionEngine.enabled;
        
        btn.textContent = enabled ? '⏸️ 暂停' : '▶️ 继续';
        btn.style.background = enabled ? '#ef4444' : '#10b981';
      }
      
      updateDebugButton() {
        const btn = document.getElementById('toggleDebug');
        const enabled = document.body.classList.contains('debug-mode');
        
        btn.textContent = enabled ? '🔍 调试ON' : '🔍 调试OFF';
        btn.style.background = enabled ? '#3b82f6' : '#6b7280';
      }
      
      resetTest() {
        ['chatAvatarContainer', 'messageBubbleContainer', 'accountAvatarContainer'].forEach(id => {
          document.getElementById(id).scrollTop = 0;
        });
        
        console.log('🔄 测试已重置');
      }
      
      startPerformanceMonitoring() {
        const monitor = () => {
          this.perfMonitor.update();
          requestAnimationFrame(monitor);
        };
        monitor();
      }
    }
    
    // 启动120Hz优化应用
    document.addEventListener('DOMContentLoaded', () => {
      const app = new Mobile120HzApp();
      
      // 防止页面缩放
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
    });
    
  </script>
  
</body>
