<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 CSS Anchor Positioning - 120Hz终极版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --connection-width: 2px;
      --avatar-size: 40px;
      --bubble-padding: 8px 12px;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
      /* 120Hz硬件加速 */
      will-change: auto;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0,0,0);
    }
    
    .glass {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    
    /* 移动端横向容器布局 */
    .mobile-container-wrapper {
      display: flex;
      gap: 8px;
      height: 65vh;
      padding: 0 8px;
      position: relative;
    }
    
    .mobile-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      position: relative;
      /* 硬件加速 */
      transform: translateZ(0);
      will-change: scroll-position;
    }
    
    .scroll-content {
      padding: 10px;
    }
    
    /* CSS Anchor Positioning 支持的元素样式 */
    .chat-avatar, .account-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      margin: 8px auto;
      font-size: 12px;
      position: relative;
      flex-shrink: 0;
      /* 硬件加速 */
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      /* CSS Anchor定位 - 设置为锚点 */
      anchor-name: var(--anchor-name);
    }
    
    .message-bubble {
      max-width: 90%;
      padding: var(--bubble-padding);
      border-radius: 10px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      margin: 8px auto;
      font-size: 12px;
      line-height: 1.3;
      position: relative;
      flex-shrink: 0;
      /* 硬件加速 */
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      /* CSS Anchor定位 - 设置为锚点 */
      anchor-name: var(--anchor-name);
    }
    
    .bubble-other {
      background: rgba(156, 163, 175, 0.25);
      border: 1px solid rgba(156, 163, 175, 0.4);
      margin-left: 10px;
      margin-right: auto;
    }
    
    .bubble-self {
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      margin-right: 10px;
      margin-left: auto;
    }
    
    /* CSS Anchor Positioning 连接线系统 */
    .connection-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 50;
      /* 120Hz优化 */
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
    }
    
    .connection-line {
      position: absolute;
      pointer-events: none;
      /* CSS Anchor定位 - 相对于锚点定位 */
      position-anchor: var(--source-anchor);
      /* 120Hz优化 */
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
    }
    
    /* 使用伪元素绘制L型连接线 */
    .connection-line::before,
    .connection-line::after {
      content: '';
      position: absolute;
      background: var(--connection-color);
      transform: translate3d(0,0,0);
    }
    
    /* 水平线段 */
    .connection-line::before {
      width: var(--h-length);
      height: var(--connection-width);
      left: anchor(var(--source-anchor) right);
      top: anchor(var(--source-anchor) center);
      transform: translateY(-50%);
    }
    
    /* 垂直线段 */
    .connection-line::after {
      width: var(--connection-width);
      height: var(--v-length);
      left: calc(anchor(var(--source-anchor) right) + var(--h-length));
      top: var(--v-start);
    }
    
    /* 连接线的不同类型 */
    .connection-chat-to-bubble {
      --connection-color: hsl(var(--hue), 65%, 55%);
      --h-length: 15px;
    }
    
    .connection-bubble-to-account {
      --connection-color: hsl(var(--hue), 65%, 55%);
      --h-length: 15px;
    }
    
    /* 性能监控面板 */
    .perf-monitor {
      position: fixed;
      top: 5px;
      right: 5px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 10px;
      z-index: 1000;
      max-width: 140px;
      backdrop-filter: blur(10px);
      transform: translate3d(0,0,0);
    }
    
    .perf-value {
      color: #ffff00;
      font-weight: bold;
    }
    
    .perf-warning {
      color: #ff6666;
      font-weight: bold;
    }
    
    .perf-excellent {
      color: #00ff66;
      font-weight: bold;
    }
    
    /* 控制面板 */
    .control-panel {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    
    .control-btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 60px;
      text-align: center;
      transform: translate3d(0,0,0);
    }
    
    /* 加载状态 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      color: white;
      transform: translate3d(0,0,0);
    }
    
    .loading-progress {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 20px 0;
      overflow: hidden;
    }
    
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s;
    }
    
    /* 调试模式 */
    .debug-mode .chat-avatar,
    .debug-mode .account-avatar { 
      outline: 1px solid rgba(0, 255, 0, 0.8);
    }
    
    .debug-mode .message-bubble { 
      outline: 1px solid rgba(255, 0, 0, 0.8);
    }
    
    .debug-mode .connection-line::before,
    .debug-mode .connection-line::after { 
      background: #ff0080 !important;
      z-index: 100;
    }
    
    /* 滚动条优化 */
    .mobile-container::-webkit-scrollbar {
      width: 3px;
    }
    
    .mobile-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    
    .mobile-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }
    
    /* 120Hz优化 - 减少重绘 */
    .mobile-container {
      contain: layout style paint;
    }
    
    .scroll-content {
      contain: layout style;
    }
    
    /* CSS Anchor Positioning Fallback - 如果不支持则隐藏连接线 */
    @supports not (anchor-name: --test) {
      .connection-line {
        display: none;
      }
      
      .perf-monitor::after {
        content: '\A⚠️ CSS Anchor不支持';
        white-space: pre;
        color: #ff6666;
      }
    }
  </style>
</head>
<body>
  
  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="font-size: 24px; margin-bottom: 10px;">⚓</div>
    <div>CSS Anchor Positioning 120Hz</div>
    <div class="loading-progress">
      <div id="loadingBar" class="loading-bar"></div>
    </div>
    <div id="loadingText">正在生成1000个锚点...</div>
  </div>
  
  <!-- 性能监控面板 -->
  <div id="perfMonitor" class="perf-monitor">
    <div>⚓ CSS Anchor 120Hz</div>
    <div>FPS: <span id="fps" class="perf-value">--</span></div>
    <div>帧时: <span id="frameTime" class="perf-value">--</span>ms</div>
    <div>连接: <span id="connectionCount" class="perf-value">0</span></div>
    <div>方式: <span id="renderMode" class="perf-value">CSS原生</span></div>
    <div>状态: <span id="systemStatus" class="perf-value">准备中</span></div>
  </div>

  <!-- 控制面板 -->
  <div class="control-panel">
    <button id="toggleConnections" class="control-btn" style="background: #ef4444;">
      👁️ 隐藏连接线
    </button>
    <button id="toggleDebug" class="control-btn" style="background: #6b7280;">
      🔍 调试
    </button>
    <button id="refreshCSS" class="control-btn" style="background: #10b981;">
      ⚓ 刷新锚点
    </button>
    <button id="resetTest" class="control-btn" style="background: #3b82f6;">
      🔄 重置
    </button>
  </div>

  <div class="p-2">
    
    <!-- 标题 -->
    <div class="text-center mb-4 pt-2">
      <h1 class="text-xl font-bold text-white mb-1">⚓ CSS Anchor Positioning</h1>
      <p class="text-white/80 text-sm">1000连接线 • 原生CSS • 120Hz极速</p>
    </div>

    <!-- 三个横向排列的容器 -->
    <div class="mobile-container-wrapper">
      
      <!-- 容器1：会话头像 -->
      <div class="glass mobile-container" id="chatAvatarContainer">
        <div class="scroll-content" id="chatAvatarContent">
          <!-- 动态生成1000个会话头像锚点 -->
        </div>
      </div>

      <!-- 容器2：消息气泡 -->
      <div class="glass mobile-container" id="messageBubbleContainer">
        <div class="scroll-content" id="messageBubbleContent">
          <!-- 动态生成1000个消息气泡锚点 -->
        </div>
      </div>

      <!-- 容器3：账号头像 -->
      <div class="glass mobile-container" id="accountAvatarContainer">
        <div class="scroll-content" id="accountAvatarContent">
          <!-- 动态生成1000个账号头像锚点 -->
        </div>
      </div>

    </div>

    <!-- CSS连接线容器 -->
    <div id="connectionContainer" class="connection-container">
      <!-- 动态生成CSS Anchor连接线 -->
    </div>

  </div>
  
  <script>
    // CSS Anchor Positioning 120Hz连接引擎
    class CSSAnchor120HzEngine {
      constructor() {
        this.connections = [];
        this.connectionsVisible = true;
        this.debugMode = false;
        this.connectionContainer = null;
        
        // CSS Anchor支持检测
        this.anchorSupported = this.detectAnchorSupport();
        
        this.init();
      }
      
      detectAnchorSupport() {
        // 检测CSS Anchor Positioning支持
        try {
          const testEl = document.createElement('div');
          testEl.style.anchorName = '--test';
          return testEl.style.anchorName === '--test';
        } catch (e) {
          return false;
        }
      }
      
      init() {
        this.connectionContainer = document.getElementById('connectionContainer');
        
        if (!this.anchorSupported) {
          console.warn('⚠️ CSS Anchor Positioning 不支持，连接线将被隐藏');
          document.getElementById('renderMode').textContent = '不支持';
          document.getElementById('renderMode').className = 'perf-warning';
          return;
        }
        
        this.log('✅ CSS Anchor Positioning 120Hz引擎初始化完成');
        document.getElementById('renderMode').textContent = 'CSS原生';
        document.getElementById('renderMode').className = 'perf-excellent';
      }
      
      createConnections(count) {
        if (!this.anchorSupported) {
          document.getElementById('connectionCount').textContent = '不支持';
          return;
        }
        
        this.connections = [];
        this.connectionContainer.innerHTML = '';
        
        for (let i = 0; i < count; i++) {
          const isSelf = i % 3 === 2;
          const hue = (i * 137) % 360;
          
          // 创建连接线1: 会话头像 → 消息气泡
          const chatToBubble = this.createCSSConnection(
            `--chat-${i}`, 
            `--bubble-${i}`, 
            hue, 
            'chat-to-bubble',
            i
          );
          
          // 创建连接线2: 消息气泡 → 账号头像
          const bubbleToAccount = this.createCSSConnection(
            `--bubble-${i}`, 
            `--account-${i}`, 
            hue, 
            'bubble-to-account',
            i
          );
          
          this.connectionContainer.appendChild(chatToBubble);
          this.connectionContainer.appendChild(bubbleToAccount);
          
          this.connections.push({
            id: i,
            chatToBubble: chatToBubble,
            bubbleToAccount: bubbleToAccount,
            type: isSelf ? 'self' : 'other',
            hue: hue
          });
        }
        
        document.getElementById('connectionCount').textContent = this.connections.length * 2;
        this.log(`⚓ 创建了 ${this.connections.length * 2} 个CSS Anchor连接线`);
      }
      
      createCSSConnection(sourceAnchor, targetAnchor, hue, connectionType, index) {
        const connection = document.createElement('div');
        connection.className = `connection-line connection-${connectionType}`;
        connection.style.setProperty('--source-anchor', sourceAnchor);
        connection.style.setProperty('--target-anchor', targetAnchor);
        connection.style.setProperty('--hue', hue);
        connection.style.setProperty('--connection-color', `hsl(${hue}, 65%, 55%)`);
        connection.setAttribute('data-connection-id', index);
        connection.setAttribute('data-connection-type', connectionType);
        
        return connection;
      }
      
      toggleConnections() {
        this.connectionsVisible = !this.connectionsVisible;
        
        if (this.connectionsVisible) {
          this.connectionContainer.style.display = 'block';
          document.getElementById('systemStatus').textContent = 'CSS运行';
          document.getElementById('systemStatus').className = 'perf-excellent';
        } else {
          this.connectionContainer.style.display = 'none';
          document.getElementById('systemStatus').textContent = '隐藏';
          document.getElementById('systemStatus').className = 'perf-warning';
        }
        
        this.log(`👁️ 连接线显示: ${this.connectionsVisible ? '启用' : '隐藏'}`);
      }
      
      setDebugMode(enabled) {
        this.debugMode = enabled;
        document.body.classList.toggle('debug-mode', enabled);
        this.log(`🔍 调试模式: ${enabled ? '启用' : '禁用'}`);
      }
      
      refreshAnchors() {
        if (!this.anchorSupported) return;
        
        // 强制重新计算CSS Anchor位置
        this.connectionContainer.style.display = 'none';
        requestAnimationFrame(() => {
          this.connectionContainer.style.display = 'block';
        });
        
        this.log('⚓ CSS锚点已刷新');
      }
      
      log(message) {
        console.log(`[CSS Anchor引擎] ${message}`);
      }
    }
    
    // 120Hz性能监控器（简化版）
    class CSSAnchor120HzMonitor {
      constructor() {
        this.frameCount = 0;
        this.lastTime = performance.now();
        this.fps = 0;
        this.frameTime = 0;
      }
      
      update() {
        this.frameCount++;
        const now = performance.now();
        
        if (now - this.lastTime >= 1000) {
          this.fps = Math.round(this.frameCount * 1000 / (now - this.lastTime));
          this.frameTime = Math.round((now - this.lastTime) / this.frameCount * 100) / 100;
          
          document.getElementById('fps').textContent = this.fps;
          document.getElementById('frameTime').textContent = this.frameTime;
          
          // FPS性能评级
          if (this.fps >= 100) {
            document.getElementById('fps').className = 'perf-excellent';
          } else if (this.fps >= 60) {
            document.getElementById('fps').className = 'perf-value';
          } else {
            document.getElementById('fps').className = 'perf-warning';
          }
          
          this.frameCount = 0;
          this.lastTime = now;
        }
      }
    }
    
    // CSS Anchor主应用
    class CSSAnchor120HzApp {
      constructor() {
        this.connectionEngine = new CSSAnchor120HzEngine();
        this.perfMonitor = new CSSAnchor120HzMonitor();
        this.elementsGenerated = false;
        
        this.setupEventListeners();
        this.generateElements();
      }
      
      setupEventListeners() {
        document.getElementById('toggleConnections').addEventListener('click', () => {
          this.connectionEngine.toggleConnections();
          this.updateConnectionButton();
        });
        
        document.getElementById('toggleDebug').addEventListener('click', () => {
          const enabled = document.body.classList.contains('debug-mode');
          this.connectionEngine.setDebugMode(!enabled);
          this.updateDebugButton();
        });
        
        document.getElementById('refreshCSS').addEventListener('click', () => {
          this.connectionEngine.refreshAnchors();
        });
        
        document.getElementById('resetTest').addEventListener('click', () => {
          this.resetTest();
        });
      }
      
      async generateElements() {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingBar = document.getElementById('loadingBar');
        const loadingText = document.getElementById('loadingText');
        
        const count = 1000;
        const batchSize = 50;
        
        for (let batch = 0; batch < count / batchSize; batch++) {
          const start = batch * batchSize;
          const end = Math.min(start + batchSize, count);
          
          const progress = (end / count) * 100;
          loadingBar.style.width = progress + '%';
          loadingText.textContent = `生成CSS锚点 ${end}/${count}`;
          
          await this.generateBatch(start, end);
          await new Promise(resolve => setTimeout(resolve, 5));
        }
        
        this.setContainerHeights(count);
        
        loadingText.textContent = '创建CSS连接线...';
        await new Promise(resolve => setTimeout(resolve, 100));
        this.connectionEngine.createConnections(count);
        
        this.startPerformanceMonitoring();
        
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 300);
        
        document.getElementById('systemStatus').textContent = 'CSS就绪';
        document.getElementById('systemStatus').className = 'perf-excellent';
        this.elementsGenerated = true;
        
        console.log('⚓ CSS Anchor Positioning 120Hz版本启动完成');
      }
      
      async generateBatch(start, end) {
        const chatContainer = document.getElementById('chatAvatarContent');
        const bubbleContainer = document.getElementById('messageBubbleContent');
        const accountContainer = document.getElementById('accountAvatarContent');
        
        // 使用DocumentFragment优化DOM操作
        const chatFragment = document.createDocumentFragment();
        const bubbleFragment = document.createDocumentFragment();
        const accountFragment = document.createDocumentFragment();
        
        for (let i = start; i < end; i++) {
          // 会话头像 - CSS锚点
          const chatAvatar = document.createElement('div');
          chatAvatar.className = 'chat-avatar';
          chatAvatar.style.background = `hsl(${(i * 137) % 360}, 70%, 50%)`;
          chatAvatar.style.setProperty('--anchor-name', `--chat-${i}`);
          chatAvatar.textContent = String.fromCharCode(65 + (i % 26));
          chatFragment.appendChild(chatAvatar);
          
          // 消息气泡 - CSS锚点
          const bubble = document.createElement('div');
          const isSelf = i % 3 === 2;
          bubble.className = `message-bubble ${isSelf ? 'bubble-self' : 'bubble-other'}`;
          bubble.style.setProperty('--anchor-name', `--bubble-${i}`);
          bubble.textContent = `消息 ${i + 1} ${isSelf ? '(我)' : '(对方)'}`;
          bubbleFragment.appendChild(bubble);
          
          // 账号头像 - CSS锚点
          const accountAvatar = document.createElement('div');
          accountAvatar.className = 'account-avatar';
          accountAvatar.style.background = `hsl(${(i * 137 + 30) % 360}, 70%, 45%)`;
          accountAvatar.style.setProperty('--anchor-name', `--account-${i}`);
          accountAvatar.textContent = String.fromCharCode(65 + (i % 26));
          accountFragment.appendChild(accountAvatar);
        }
        
        // 批量插入DOM
        chatContainer.appendChild(chatFragment);
        bubbleContainer.appendChild(bubbleFragment);
        accountContainer.appendChild(accountFragment);
      }
      
      setContainerHeights(count) {
        const elementHeight = 56;
        
        document.getElementById('chatAvatarContent').style.height = (count * elementHeight) + 'px';
        document.getElementById('messageBubbleContent').style.height = (count * elementHeight) + 'px';
        document.getElementById('accountAvatarContent').style.height = (count * elementHeight) + 'px';
      }
      
      updateConnectionButton() {
        const btn = document.getElementById('toggleConnections');
        const visible = this.connectionEngine.connectionsVisible;
        
        btn.textContent = visible ? '👁️ 隐藏连接线' : '👁️ 显示连接线';
        btn.style.background = visible ? '#ef4444' : '#10b981';
      }
      
      updateDebugButton() {
        const btn = document.getElementById('toggleDebug');
        const enabled = document.body.classList.contains('debug-mode');
        
        btn.textContent = enabled ? '🔍 调试ON' : '🔍 调试OFF';
        btn.style.background = enabled ? '#3b82f6' : '#6b7280';
      }
      
      resetTest() {
        ['chatAvatarContainer', 'messageBubbleContainer', 'accountAvatarContainer'].forEach(id => {
          document.getElementById(id).scrollTop = 0;
        });
        
        console.log('🔄 CSS Anchor测试已重置');
      }
      
      startPerformanceMonitoring() {
        const monitor = () => {
          this.perfMonitor.update();
          requestAnimationFrame(monitor);
        };
        monitor();
      }
    }
    
    // 检查CSS Anchor Positioning支持并启动应用
    document.addEventListener('DOMContentLoaded', () => {
      // 检测CSS Anchor支持
      const supportsAnchor = CSS.supports('anchor-name', '--test') || CSS.supports('position-anchor', '--test');
      
      if (!supportsAnchor) {
        console.warn('⚠️ 浏览器不支持CSS Anchor Positioning，将显示警告信息');
        document.getElementById('renderMode').textContent = '不支持';
        document.getElementById('renderMode').className = 'perf-warning';
      }
      
      const app = new CSSAnchor120HzApp();
      
      // 防止页面缩放
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
      
      // 优化触摸滚动
      document.addEventListener('touchmove', e => {
        if (!e.target.closest('.mobile-container')) {
          e.preventDefault();
        }
      }, { passive: false });
    });
    
  </script>
  
</body>
</html>
