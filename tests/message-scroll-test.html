<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息间距滚动测试 - 几百条消息类型组合</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ============= CSS变量定义 ============= */
    :root {
      --message-border-radius: 6px;
      --message-padding: 7px 7px;
      --message-vertical-gap: 9px;
      --message-horizontal-gap: 7px;
      --avatar-size: 37px;
      --bubble-height: 37px;
      --text-line-height: 1.2;
      --quote-bar-width: 3px;
      --quote-bar-color: rgba(255, 255, 255, 0.6);
      --glass-blur: 20px;
      --text-shadow-enhanced: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(0, 0, 0, 0.4), 0 0 10px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.5);
      --sender-name-shadow: 0 2px 6px rgba(0, 0, 0, 1), 0 0 16px rgba(255, 255, 255, 0.9), 0 0 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
      
      /* AI草稿消息增强多层阴影方案变量 */
      --ai-draft-opacity: 0.85;
      --ai-draft-other-border: #999;
      --ai-draft-self-border: #333;
      
      /* 增强外阴影组合 */
      --ai-draft-outer-shadow-main: 0 0 12px rgba(0,0,0,0.25);
      --ai-draft-outer-shadow-soft: 0 2px 8px rgba(0,0,0,0.15);
      
      /* 增强内阴影组合 */
      --ai-draft-inner-shadow-deep: inset 0 0 6px rgba(0,0,0,0.4);
      --ai-draft-inner-shadow-soft: inset 0 1px 3px rgba(0,0,0,0.3);
      
      /* 多层高光效果 */
      --ai-draft-inner-highlight-main: inset 0 0 2px rgba(255,255,255,0.2);
      --ai-draft-inner-highlight-edge: inset 1px 1px 1px rgba(255,255,255,0.15);
      --ai-draft-outer-highlight: 0 0 0 1px rgba(255,255,255,0.1);
      
      /* 语音消息和聊天记录消息变量 */
      --voice-message-bg: rgba(108, 99, 255, 0.1);
      --voice-message-border: rgba(108, 99, 255, 0.3);
      --voice-playing-color: #6c63ff;
      --chat-record-bg: rgba(34, 197, 94, 0.1);
      --chat-record-border: rgba(34, 197, 94, 0.3);
      --chat-record-color: #22c55e;
      
      /* ============= 2025 SVG图标系统增强变量 ============= */
      /* 描边宽度标准 (基于最佳实践) */
      --stroke-thin: 1px;       /* 小尺寸图标 (16px-20px) */
      --stroke-regular: 2px;    /* 标准尺寸图标 (24px-32px) */
      --stroke-bold: 3px;       /* 大尺寸图标 (48px+) */
      
      /* 语义化色彩变量 */
      --icon-color-default: currentColor;
      --icon-color-muted: #666666;
      --icon-color-interactive: var(--voice-playing-color);
      --icon-color-success: var(--chat-record-color);
      --icon-color-warning: #ffc107;
      --icon-color-error: #dc3545;
      
      /* 阴影效果变量 */
      --icon-shadow-subtle: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.2));
      --icon-shadow-medium: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
      --icon-shadow-strong: drop-shadow(4px 4px 8px rgba(0, 0, 0, 0.4));
      --icon-shadow-hover: drop-shadow(4px 4px 12px rgba(0, 0, 0, 0.4));
    }

    /* ============= 基础样式 ============= */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* ============= 滚动容器样式 ============= */
    .scroll-container {
      height: 80vh;
      max-width: 800px;
      margin: 0 auto;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .scroll-container::-webkit-scrollbar {
      width: 8px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }

    .scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* ============= 消息基础Block ============= */
    .message {
      width: 100%;
      margin-bottom: var(--message-vertical-gap);
    }

    .message__container {
      display: flex;
      align-items: flex-start;
      gap: var(--message-horizontal-gap);
      max-width: 100%;
    }

    .message__avatar {
      flex-shrink: 0;
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: var(--message-border-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.15);
    }

    .message__content {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .message__bubble {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--message-border-radius);
      padding: var(--message-padding);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-height: var(--bubble-height);
      display: flex;
      align-items: center;
      position: relative;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.15);
    }

    .message__text {
      color: white;
      font-size: 0.95rem;
      line-height: var(--text-line-height);
      word-break: break-word;
      text-shadow: var(--text-shadow-enhanced);
      width: 100%;
    }

    /* ============= 发送者相关 ============= */
    .message__sender {
      position: absolute;
      top: -19px;
      left: 8px;
      font-size: 0.75rem;
      color: white;
      text-shadow: var(--sender-name-shadow);
      white-space: nowrap;
      z-index: 20;
      font-weight: 400;
    }

    /* 群聊名样式 */
    .message__group-name {
      color: rgba(255, 255, 255, 0.75);
      margin-left: 6px;
      font-weight: 300;
    }

    /* ============= self 和 other 布局 ============= */
    .message--self .message__container {
      flex-direction: row-reverse;
    }

    .message--self .message__bubble {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .message--self .message__sender {
      left: auto;
      right: 8px;
    }

    /* AI草稿气泡样式 - 标准虚线边框 + 增强多层阴影高光 */
    .message--ai-draft .message__bubble {
      /* 标准虚线边框，天然支持圆角 */
      border: 3px dashed var(--ai-draft-other-border);
      border-radius: 6px;
      background: transparent;
      
      /* 增强多层阴影高光组合：6层效果叠加 */
      box-shadow: 
        /* 外阴影组 - 营造深度和存在感 */
        var(--ai-draft-outer-shadow-main),     /* 主外阴影：强烈深度 */
        var(--ai-draft-outer-shadow-soft),     /* 辅外阴影：柔和扩散 */
        var(--ai-draft-outer-highlight),       /* 外轮廓高光 */
        
        /* 内阴影组 - 增强边框对比和立体感 */
        var(--ai-draft-inner-shadow-deep),     /* 深内阴影：强对比 */
        var(--ai-draft-inner-shadow-soft),     /* 轻内阴影：边缘细节 */
        
        /* 高光组 - 创造精致感和光泽 */
        var(--ai-draft-inner-highlight-main),  /* 主内高光：整体亮度 */
        var(--ai-draft-inner-highlight-edge);  /* 边缘高光：精致细节 */
      
      opacity: var(--ai-draft-opacity);
      position: relative;
    }

    /* Self消息使用黑色虚线边框 + 重新调整阴影 */
    .message--ai-draft.message--self .message__bubble {
      border-color: var(--ai-draft-self-border);
      /* Self消息的黑色边框阴影配置：强化阴影对比，减少高光 */
      box-shadow: 
        /* 外阴影保持一致 */
        var(--ai-draft-outer-shadow-main),
        var(--ai-draft-outer-shadow-soft),
        0 0 0 1px rgba(0,0,0,0.1),                     /* 外轮廓黑色细线 */
        
        /* 强化内阴影，突出黑色边框 */
        inset 0 0 5px rgba(0,0,0,0.4),                 /* 强内阴影 */
        inset 0 1px 3px rgba(0,0,0,0.3),               /* 边缘深阴影 */
        
        /* 适度内高光，与黑色边框平衡 */
        inset 0 0 1px rgba(255,255,255,0.15),          /* 轻微内高光 */
        inset 1px 1px 1px rgba(255,255,255,0.1);       /* 边缘轻高光 */
    }

    /* ============= 类型11: 语音消息 ============= */
    .message--voice-message .message__bubble {
      background: var(--voice-message-bg);
      border: 1px solid var(--voice-message-border);
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
    }
    
    .message--voice-message .message__bubble:hover {
      background: rgba(108, 99, 255, 0.15);
      transform: translateY(-1px);
    }
    
    .voice-message__container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .voice-message__compact {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    
    .voice-message__icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--voice-playing-color), #8b5cf6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    
    /* ============= SVG图标系统 ============= */
    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      /* 2025默认设置：无描边 + 白色填充 + strong阴影 */
      fill: white;
      stroke: none;
      filter: var(--icon-shadow-strong);
    }
    
    /* 图标尺寸系统 */
    .svg-icon--xs { 
      width: 12px; 
      height: 12px; 
      --current-stroke-width: var(--stroke-thin);
    }
    .svg-icon--sm { 
      width: 14px; 
      height: 14px; 
      --current-stroke-width: var(--stroke-thin);
    }
    .svg-icon--md { 
      width: 16px; 
      height: 16px; 
      --current-stroke-width: var(--stroke-regular);
    }
    .svg-icon--lg { 
      width: 20px; 
      height: 20px; 
      --current-stroke-width: var(--stroke-regular);
    }
    .svg-icon--xl { 
      width: 24px; 
      height: 24px; 
      --current-stroke-width: var(--stroke-regular);
    }
    
    /* 图标主题系统 - 2025增强版本 */
    .svg-icon--primary { 
      fill: var(--icon-color-interactive); 
      stroke: var(--icon-color-interactive);
    }
    .svg-icon--white { 
      fill: white; 
      stroke: white;
    }
    .svg-icon--gray { 
      fill: var(--icon-color-muted); 
      stroke: var(--icon-color-muted);
    }
    .svg-icon--success { 
      fill: var(--icon-color-success); 
      stroke: var(--icon-color-success);
    }
    .svg-icon--danger { 
      fill: var(--icon-color-error); 
      stroke: var(--icon-color-error);
    }
    .svg-icon--warning { 
      fill: var(--icon-color-warning); 
      stroke: var(--icon-color-warning);
    }
    .svg-icon--default { 
      fill: var(--icon-color-default); 
      stroke: var(--icon-color-default);
    }
    
    /* 图标状态系统 */
    .svg-icon--clickable {
      cursor: pointer;
    }
    
    .svg-icon--clickable:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }
    
    .svg-icon--disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    
    .svg-icon--spinning {
      animation: icon-spin 1s linear infinite;
    }
    
    @keyframes icon-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* 阴影效果系统 - 基于2025最佳实践 */
    .svg-icon--shadow-subtle {
      filter: var(--icon-shadow-subtle);
    }
    
    .svg-icon--shadow-medium {
      filter: var(--icon-shadow-medium);
    }
    
    .svg-icon--shadow-strong {
      filter: var(--icon-shadow-strong);
    }
    
    /* 响应式描边控制 - 防止描边随缩放变化 */
    .svg-icon path {
      stroke-width: var(--current-stroke-width, 0); /* 默认无描边 */
      vector-effect: non-scaling-stroke;
    }
    
    /* 需要描边的图标专用类 */
    .svg-icon--with-stroke path {
      stroke-width: var(--current-stroke-width, var(--stroke-regular));
    }
    
    /* 无障碍访问增强 */
    .svg-icon[aria-hidden="false"] {
      speak: auto;
    }
    
    .svg-icon:focus {
      outline: 2px solid var(--icon-color-interactive);
      outline-offset: 2px;
    }
    
    /* 高对比度模式支持 */
    @media (prefers-contrast: high) {
      .svg-icon--primary {
        fill: #000000;
        stroke: #000000;
      }
      .svg-icon--white {
        fill: #ffffff;
        stroke: #ffffff;
      }
    }
    
    /* 图标容器系统 */
    .icon-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    
    .icon-container--sm {
      width: 24px;
      height: 24px;
      padding: 4px;
    }
    
    .icon-container--md {
      width: 32px;
      height: 32px;
      padding: 6px;
    }
    
    .icon-container--lg {
      width: 40px;
      height: 40px;
      padding: 8px;
    }
    
    .icon-container--primary {
      background: linear-gradient(135deg, var(--voice-playing-color), #8b5cf6);
    }
    
    .icon-container--success {
      background: linear-gradient(135deg, var(--chat-record-color), #10b981);
    }
    
    /* 语音消息专用样式（向后兼容） */
    .voice-icon-svg {
      width: 14px;
      height: 14px;
      fill: white;
    }
    
    .voice-pause-svg {
      width: 14px;
      height: 14px;
      fill: white;
    }
    
    .voice-message__icon.playing {
      animation: voice-pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes voice-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    .voice-message__duration {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
      margin-right: 8px;
    }
    
    .voice-message__click-hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      margin-left: 8px;
      font-style: italic;
    }
    
    .voice-message__expanded {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-top: 4px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      display: none;
    }
    
    .voice-message__expanded.show {
      display: block;
      animation: expand-in 0.3s ease;
    }
    
    @keyframes expand-in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* ============= 类型12: 聊天记录消息 ============= */
    .message--chat-record .message__bubble {
      background: var(--chat-record-bg);
      border: 1px solid var(--chat-record-border);
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 12px;
    }
    
    .message--chat-record .message__bubble:hover {
      background: rgba(34, 197, 94, 0.15);
      transform: translateY(-1px);
    }
    
    .chat-record__container {
      width: 100%;
    }
    
    .chat-record__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .chat-record__icon {
      width: 24px;
      height: 24px;
      background: var(--chat-record-color);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }
    
    .chat-record__title {
      color: var(--chat-record-color);
      font-weight: 600;
      font-size: 14px;
    }
    
    .chat-record__count {
      background: rgba(34, 197, 94, 0.2);
      color: var(--chat-record-color);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
    }
    
    .chat-record__summary {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      line-height: 1.4;
    }
    
    .chat-record__participants {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .chat-record__last-message {
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
    }
    
    .chat-record__expanded {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    
    .chat-record__expanded.show {
      display: block;
      animation: expand-in 0.3s ease;
    }
    
    .chat-record__message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      padding: 6px 0;
    }
    
    .chat-record__message:last-child {
      margin-bottom: 0;
    }
    
    .chat-record__avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
      font-weight: 500;
      flex-shrink: 0;
    }
    
    .chat-record__content {
      flex: 1;
    }
    
    .chat-record__sender {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 2px;
      font-weight: 500;
    }
    
    .chat-record__text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.3;
    }

    /* ============= 类型7: 无气泡消息 ============= */
    .message--type7 .message__container {
      justify-content: center;
    }

    .message--type7 .message__text {
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: var(--message-border-radius);
      font-size: 0.875rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    /* ============= 类型10: 分离引用消息（独立消息重构） ============= */
    /* 引用消息样式 - 作为独立消息显示 */
    .message--quote {
      margin-bottom: 4px; /* 与回复消息间距更小 */
    }

    .message--quote .message__bubble {
      background: rgba(128, 128, 128, 0.2); /* 灰色背景 */
      border: 1px solid rgba(156, 163, 175, 0.3);
      font-size: 0.875rem; /* 小一号字体 */
      opacity: 0.9;
    }

    .message--quote .message__text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.875rem;
      line-height: 1.3;
    }

    .message--quote .message__sender {
      font-size: 0.7rem; /* 发送者名也相应减小 */
      opacity: 0.9;
    }

    /* 引用标识已移除 - 灰色背景已足够区分 */

    /* 回复消息与引用消息的关联样式 */
    .message--reply-to-quote {
      margin-top: 0; /* 紧跟引用消息 */
    }

    /* ============= 引用样式 (类型8) ============= */
    .message__quote {
      margin-bottom: 8px;
      border-left: var(--quote-bar-width) solid var(--quote-bar-color);
      padding-left: 8px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      padding: 6px 8px;
    }

    .message__quote-content {
      font-size: 0.8rem;
    }

    .message__quote-author {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      margin-bottom: 2px;
      font-size: 0.75rem;
    }

    .message__quote-text {
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
      line-height: 1.3;
    }

    /* ============= 控制面板 ============= */
    .control-panel {
      max-width: 800px;
      margin: 0 auto 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .control-panel button {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      font-weight: 500;
      font-size: 0.875rem;
    }

    .control-panel button:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .control-panel select, .control-panel input {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 6px;
      backdrop-filter: blur(10px);
      font-size: 0.875rem;
    }

    .control-panel select option {
      background: #4a5568;
      color: white;
    }

    .message-stats {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>

      // 创建SVG元素（2025增强版本 - 性能监控 + 无障碍）
      createIcon(name, options = {}) {
        const startTime = performance.now();
        
        const iconConfig = this.getIcon(name);
        if (!iconConfig) {
          console.warn(`Icon '${name}' not found`);
          return null;
        }
        
        const {
          size = 'md',
          theme = 'white',        // 默认白色
          clickable = false,
          disabled = false,
          spinning = false,
          shadow = 'strong',      // 默认strong阴影
          ariaLabel = '',
          ariaHidden = true,
          className = ''
        } = options;
        
        // 创建缓存键
        const cacheKey = `${name}-${size}-${theme}-${clickable}-${disabled}-${spinning}-${shadow}-${className}`;
        
        // 检查缓存
        if (this.cache.has(cacheKey)) {
          this.metrics.cacheHits++;
          const cached = this.cache.get(cacheKey).cloneNode(true);
          
          // 应用无障碍属性（动态设置）
          if (ariaLabel) {
            cached.setAttribute('aria-label', ariaLabel);
            cached.setAttribute('aria-hidden', 'false');
          } else {
            cached.setAttribute('aria-hidden', ariaHidden.toString());
          }
          
          return cached;
        }
        
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', iconConfig.viewBox);
        svg.setAttribute('role', 'img');
        
        // 无障碍属性设置
        if (ariaLabel) {
          svg.setAttribute('aria-label', ariaLabel);
          svg.setAttribute('aria-hidden', 'false');
        } else {
          svg.setAttribute('aria-hidden', ariaHidden.toString());
        }
        
        // 键盘访问支持
        if (clickable) {
          svg.setAttribute('tabindex', '0');
          svg.setAttribute('role', 'button');
        }
        
        // 构建CSS类名
        const classes = [
          'svg-icon',
          `svg-icon--${size}`,
          `svg-icon--${theme}`,
          clickable ? 'svg-icon--clickable' : '',
          disabled ? 'svg-icon--disabled' : '',
          spinning ? 'svg-icon--spinning' : '',
          shadow ? `svg-icon--shadow-${shadow}` : '',
          className
        ].filter(Boolean).join(' ');
        
        svg.className = classes;
        
        iconConfig.paths.forEach(pathData => {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathData);
          
          // 移除内联fill和stroke属性，让CSS样式生效
          path.removeAttribute('fill');
          path.removeAttribute('stroke');
          
          svg.appendChild(path);
        });
        
        // 存储到缓存（限制缓存大小）
        if (this.cache.size < 50) {
          this.cache.set(cacheKey, svg.cloneNode(true));
          this.metrics.cached++;
        }
        
        // 性能监控
        const endTime = performance.now();
        this.metrics.renderTime += (endTime - startTime);
        this.metrics.created++;
        
        return svg;
      }

        if (icon) {

    // 滚动控制函数
    function scrollToTop() {
      document.querySelector('.scroll-container').scrollTop = 0;
    }

    function scrollToBottom() {
      const container = document.querySelector('.scroll-container');
      container.scrollTop = container.scrollHeight;
    }

    // 语音消息交互逻辑
    function toggleVoiceMessage(bubble) {
      const expanded = bubble.querySelector('.voice-message__expanded');
      
      if (expanded && expanded.classList.contains('show')) {
        // 收起
        expanded.classList.remove('show');
      } else if (expanded) {
        // 展开
        expanded.classList.add('show');
      }
    }
    
    // 语音播放功能（使用图标管理器）
    function playVoice(iconElement) {
      event.stopPropagation(); // 阻止事件冒泡
      
      const isPlaying = iconElement.classList.contains('playing');
      
      if (isPlaying) {
        // 暂停播放 - 显示声音图标
        const voiceIcon = iconManager.createIcon('voice', { size: 'sm', theme: 'white' });
        iconElement.innerHTML = '';
        iconElement.appendChild(voiceIcon);
        iconElement.classList.remove('playing');
      } else {
        // 开始播放 - 显示暂停图标
        const pauseIcon = iconManager.createIcon('pause', { size: 'sm', theme: 'white' });
        iconElement.innerHTML = '';
        iconElement.appendChild(pauseIcon);
        iconElement.classList.add('playing');
        
        // 获取时长并模拟播放结束
        const durationText = iconElement.nextElementSibling.textContent;
        const duration = parseInt(durationText.replace('"', '')) * 1000;
        
        setTimeout(() => {
          const voiceIcon = iconManager.createIcon('voice', { size: 'sm', theme: 'white' });
          iconElement.innerHTML = '';
          iconElement.appendChild(voiceIcon);
          iconElement.classList.remove('playing');
        }, duration);
      }
    }
    
    // 聊天记录消息交互逻辑
    function toggleChatRecord(bubble) {
      const expanded = bubble.querySelector('.chat-record__expanded');
      
      if (expanded && expanded.classList.contains('show')) {
        // 收起
        expanded.classList.remove('show');
      } else if (expanded) {
        // 展开
        expanded.classList.add('show');
      }
    }

    // 页面加载时生成初始消息
    document.addEventListener('DOMContentLoaded', function() {
      generateMessages();
      // 默认滚动到底部，模拟聊天界面
      setTimeout(() => {
        scrollToBottom();
      }, 100);
    });
  </script>
</body>
</html>
