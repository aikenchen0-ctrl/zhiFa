<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5次转折L型角点45度对称圆角验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .container {
            position: relative;
            width: 700px;
            height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 基础路径 - 静态灰色线条 */
        .base-path {
            stroke: #666;
            fill: transparent;
            stroke-width: 2;
        }

        /* 主路径 - 蓝色光线 */
        .main-path {
            stroke: #00ff88;
            stroke-width: 3;
            fill: transparent;
            filter: drop-shadow(0 0 8px #00ff88);
        }

        /* 控制点显示 */
        .control-point {
            fill: #ff6b35;
            stroke: #fff;
            stroke-width: 1;
            r: 3;
        }

        /* 路径点显示 */
        .path-point {
            fill: #00bcd4;
            stroke: #fff;
            stroke-width: 1;
            r: 4;
        }

        .title {
            position: absolute;
            top: -40px;
            font-size: 1.2rem;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .blue { background: #00bcd4; }
        .orange { background: #ff6b35; }
        .green { background: #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">5次转折L型角点45度对称圆角验证</div>
        
        <svg class="svg-container" xmlns="http://www.w3.org/2000/svg">
            <!-- 基础灰色路径显示整体结构 -->
            <path 
                class="base-path" 
                d="M 100 200 
                   L 180 200 
                   Q 200 200 200 180
                   L 200 120
                   Q 200 100 220 100
                   L 280 100
                   Q 300 100 300 120
                   L 300 180
                   Q 300 200 320 200
                   L 380 200
                   Q 400 200 400 180
                   L 400 120
                   L 500 120"
            />
            
            <!-- 主路径 - 使用L型角点控制点 -->
            <path 
                class="main-path" 
                d="M 100 200 
                   L 180 200 
                   Q 200 200 200 180
                   L 200 120
                   Q 200 100 220 100
                   L 280 100
                   Q 300 100 300 120
                   L 300 180
                   Q 300 200 320 200
                   L 380 200
                   Q 400 200 400 180
                   L 400 120
                   L 500 120"
            />
            
            <!-- 路径关键点标记 -->
            <!-- 起点和终点 -->
            <circle class="path-point" cx="100" cy="200"></circle>
            <circle class="path-point" cx="500" cy="120"></circle>
            
            <!-- 转折点 -->
            <circle class="path-point" cx="200" cy="180"></circle>
            <circle class="path-point" cx="220" cy="100"></circle>
            <circle class="path-point" cx="300" cy="120"></circle>
            <circle class="path-point" cx="320" cy="200"></circle>
            <circle class="path-point" cx="400" cy="180"></circle>
            
            <!-- L型角点控制点标记 -->
            <circle class="control-point" cx="200" cy="200"></circle> <!-- 转折1控制点 -->
            <circle class="control-point" cx="200" cy="100"></circle> <!-- 转折2控制点 -->
            <circle class="control-point" cx="300" cy="100"></circle> <!-- 转折3控制点 -->
            <circle class="control-point" cx="300" cy="200"></circle> <!-- 转折4控制点 -->
            <circle class="control-point" cx="400" cy="200"></circle> <!-- 转折5控制点 -->
        </svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot blue"></div>
                <span>路径点</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot orange"></div>
                <span>L型角点控制点</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot green"></div>
                <span>主路径</span>
            </div>
        </div>
    </div>

    <script>
        // 验证L型角点控制点的几何原理
        console.log(`
            🔍 L型角点控制点验证：
            
            转折1: 水平→垂直
            - 起点: (180, 200) → 终点: (200, 180)
            - L型角点控制点: (200, 200) ✅
            
            转折2: 垂直→水平  
            - 起点: (200, 120) → 终点: (220, 100)
            - L型角点控制点: (200, 100) ✅
            
            转折3: 水平→垂直
            - 起点: (280, 100) → 终点: (300, 120)
            - L型角点控制点: (300, 100) ✅
            
            转折4: 垂直→水平
            - 起点: (300, 180) → 终点: (320, 200)
            - L型角点控制点: (300, 200) ✅
            
            转折5: 水平→垂直
            - 起点: (380, 200) → 终点: (400, 180)  
            - L型角点控制点: (400, 200) ✅
            
            🎯 每个L型角点都位于起点和终点形成的直角顶点位置
        `);
    </script>
</body>
</html>
