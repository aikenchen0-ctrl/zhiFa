<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精确引用消息测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 完全复制模板的CSS */
    :root {
      --message-border-radius: 6px;
      --message-padding: 8px 8px;
      --message-gap: 12px;
      --avatar-size: 37px;
      --bubble-height: 37px;
      --text-line-height: 1.2;
      --quote-bar-width: 3px;
      --quote-bar-color: rgba(255, 255, 255, 0.6);
      --glass-blur: 20px;
      --text-shadow-enhanced: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 6px rgba(0, 0, 0, 0.4), 0 0 10px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.5);
      --sender-name-shadow: 0 2px 6px rgba(0, 0, 0, 1), 0 0 16px rgba(255, 255, 255, 0.9), 0 0 8px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* ========== 消息基础样式 ========== */
    .message {
      width: 100%;
      margin-bottom: var(--message-gap);
    }

    .message__container {
      display: flex;
      align-items: flex-start;
      gap: var(--message-gap);
      max-width: 100%;
    }

    .message__avatar {
      flex-shrink: 0;
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: var(--message-border-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.15);
    }

    .message__content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .message__bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(156, 163, 175, 0.4);
      border-radius: var(--message-border-radius);
      padding: var(--message-padding);
      backdrop-filter: blur(var(--glass-blur));
      transition: transform 0.2s ease;
      cursor: pointer;
      width: fit-content;
      max-width: 100%;
      min-height: var(--bubble-height);
      display: flex;
      flex-direction: column; /* 确保引用块和文本垂直排列 */
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.15);
    }

    .message__bubble:hover {
      transform: scale(1.01);
    }

    .message__text {
      color: white;
      text-shadow: var(--text-shadow-enhanced);
      word-wrap: break-word;
      line-height: var(--text-line-height);
      flex: 1;
    }

    .message__sender {
      position: absolute;
      left: 8px;
      top: 0;
      transform: translateY(-50%);
      z-index: 30;
      font-size: 0.75rem;
      color: white;
      text-shadow: var(--sender-name-shadow);
      white-space: nowrap;
    }

    /* ========== 引用样式 ========== */
    .message__quote {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      border-left: var(--quote-bar-width) solid var(--quote-bar-color);
    }

    .message__quote-content {
      flex: 1;
    }

    .message__quote-author {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .message__quote-text {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.9);
      opacity: 0.8;
      line-height: 1.4;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .title {
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 24px;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">🔍 精确引用消息测试</h1>

    <!-- 完全按照模板的结构和内容 -->
    <div class="space-y-4">
      <div class="message message--type8 message--other message--has-quote">
        <div class="message__container">
          <div class="message__avatar bg-gradient-to-br from-indigo-500 to-purple-500">
            <span class="text-white text-sm font-medium">周</span>
          </div>
          <div class="message__content">
            <div class="relative">
              <div class="message__sender">周九</div>
              <div class="message__bubble">
                <div class="message__quote">
                  <div class="message__quote-content">
                    <div class="message__quote-author">张三</div>
                    <div class="message__quote-text">这是有头像含名的消息气泡，适合个人聊天场景。</div>
                  </div>
                </div>
                <div class="message__text">
                  完全同意！这种设计确实很适合个人聊天场景。
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top: 20px; color: rgba(255,255,255,0.8); text-align: center; font-size: 0.875rem;">
      这应该与模板中的Type8引用消息完全一致
    </div>
  </div>

  <script>
    // 检查DOM结构
    console.log('引用块DOM结构:');
    const quote = document.querySelector('.message__quote');
    console.log('引用块父元素:', quote?.parentElement?.className);
    console.log('引用块后一个兄弟元素:', quote?.nextElementSibling?.className);
    console.log('引用块位置正确:', quote?.parentElement?.className === 'message__bubble' && quote?.nextElementSibling?.className === 'message__text');
  </script>
</body>
</html>
