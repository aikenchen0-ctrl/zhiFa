<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📱 移动端横向三容器1000连接线测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.15);
      --connection-width: 2px;
      --corner-radius: 6px;
      --avatar-size: 36px;
      --bubble-padding: 6px 10px;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    
    .glass {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    
    /* 移动端横向容器布局 */
    .horizontal-container-wrapper {
      display: flex;
      width: 100vw;
      height: calc(100vh - 120px); /* 减去标题和控制面板高度 */
      gap: 4px;
      padding: 4px;
    }
    
    .mobile-container {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
      position: relative;
      min-width: 0; /* 防止flex子项收缩问题 */
    }
    
    .scroll-content {
      padding: 8px;
      /* 动态高度，由JavaScript计算 */
    }
    
    /* 优化的头像样式 */
    .chat-avatar, .account-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.7);
      margin: 6px auto;
      font-size: 11px;
      position: relative;
      flex-shrink: 0;
    }
    
    /* 优化的气泡样式 */
    .message-bubble {
      max-width: calc(100% - 20px);
      padding: var(--bubble-padding);
      border-radius: 8px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      margin: 6px auto;
      font-size: 11px;
      line-height: 1.3;
      position: relative;
      flex-shrink: 0;
      word-break: break-word;
    }
    
    .bubble-other {
      background: rgba(156, 163, 175, 0.25);
      border: 1px solid rgba(156, 163, 175, 0.4);
      margin-left: 8px;
      margin-right: auto;
    }
    
    .bubble-self {
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      margin-right: 8px;
      margin-left: auto;
    }
    
    /* Canvas优化 */
    #performanceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
      will-change: transform;
    }
    
    /* 性能监控面板 - 移动端优化 */
    .perf-monitor {
      position: fixed;
      top: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      padding: 4px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 9px;
      z-index: 1000;
      max-width: 120px;
      backdrop-filter: blur(10px);
      line-height: 1.2;
    }
    
    .perf-value {
      color: #ffff00;
      font-weight: bold;
    }
    
    .perf-warning {
      color: #ff6666;
      font-weight: bold;
    }
    
    /* 控制面板 - 移动端优化 */
    .control-panel {
      position: fixed;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      justify-content: center;
      max-width: 95vw;
      overflow-x: auto;
    }
    
    .control-btn {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 50px;
      text-align: center;
      flex-shrink: 0;
      white-space: nowrap;
    }
    
    /* 加载状态 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      color: white;
    }
    
    .loading-progress {
      width: 80%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 20px 0;
      overflow: hidden;
    }
    
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s;
    }
    
    /* 容器标题 */
    .container-title {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      padding: 4px;
      font-size: 10px;
      font-weight: bold;
      z-index: 10;
      backdrop-filter: blur(10px);
    }
    
    /* 调试模式 */
    .debug-mode .chat-avatar,
    .debug-mode .account-avatar { 
      outline: 1px solid rgba(0, 255, 0, 0.8);
    }
    
    .debug-mode .message-bubble { 
      outline: 1px solid rgba(255, 0, 0, 0.8);
    }
    
    /* 滚动优化 */
    .mobile-container::-webkit-scrollbar {
      width: 2px;
    }
    
    .mobile-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
    }
    
    .mobile-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 1px;
    }
    
    /* 标题区域 */
    .title-section {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 8px;
      text-align: center;
    }
    
    .title-section h1 {
      font-size: 14px;
      font-weight: bold;
      color: white;
      margin: 0 0 2px 0;
    }
    
    .title-section p {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.8);
      margin: 0;
    }
    
    /* 主容器区域 */
    .main-container {
      margin-top: 60px; /* 标题高度 */
      margin-bottom: 40px; /* 控制面板高度 */
      height: calc(100vh - 100px);
    }
  </style>
</head>
<body>
  
  <!-- 加载遮罩 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div style="font-size: 24px; margin-bottom: 10px;">🚀</div>
    <div>正在生成1000个元素...</div>
    <div class="loading-progress">
      <div id="loadingBar" class="loading-bar"></div>
    </div>
    <div id="loadingText">初始化中...</div>
  </div>
  
  <!-- 性能监控面板 -->
  <div id="perfMonitor" class="perf-monitor">
    <div>📱 1K横向测试</div>
    <div>FPS: <span id="fps" class="perf-value">--</span></div>
    <div>渲染: <span id="frameTime" class="perf-value">--</span>ms</div>
    <div>连接: <span id="connectionCount" class="perf-value">0</span></div>
    <div>内存: <span id="memoryUsage" class="perf-value">--</span>MB</div>
    <div>状态: <span id="systemStatus" class="perf-value">准备中</span></div>
  </div>

  <!-- 标题区域 -->
  <div class="title-section">
    <h1>📱 移动端横向三容器1000连接线测试</h1>
    <p>会话头像 ↔ 消息气泡 ↔ 账号头像</p>
  </div>

  <!-- 主容器区域 -->
  <div class="main-container">
    <!-- 三个横向排列的容器 -->
    <div class="horizontal-container-wrapper">
      
      <!-- 容器1：会话头像 -->
      <div class="glass mobile-container" id="chatAvatarContainer">
        <div class="container-title">💬 会话头像</div>
        <div class="scroll-content" id="chatAvatarContent">
          <!-- 动态生成1000个会话头像 -->
        </div>
      </div>

      <!-- 容器2：消息气泡 -->
      <div class="glass mobile-container" id="messageBubbleContainer">
        <div class="container-title">💭 消息气泡</div>
        <div class="scroll-content" id="messageBubbleContent">
          <!-- 动态生成1000个消息气泡 -->
        </div>
      </div>

      <!-- 容器3：账号头像 -->
      <div class="glass mobile-container" id="accountAvatarContainer">
        <div class="container-title">👤 账号头像</div>
        <div class="scroll-content" id="accountAvatarContent">
          <!-- 动态生成1000个账号头像 -->
        </div>
      </div>

    </div>
  </div>

  <!-- 控制面板 -->
  <div class="control-panel">
    <button id="toggleRender" class="control-btn" style="background: #ef4444;">
      ⏸️ 暂停
    </button>
    <button id="toggleDebug" class="control-btn" style="background: #6b7280;">
      🔍 调试
    </button>
    <button id="optimizeMode" class="control-btn" style="background: #f59e0b;">
      ⚡ 优化
    </button>
    <button id="autoScroll" class="control-btn" style="background: #8b5cf6;">
      📜 滚动
    </button>
    <button id="resetTest" class="control-btn" style="background: #3b82f6;">
      🔄 重置
    </button>
  </div>

  <!-- 高性能Canvas -->
  <canvas id="performanceCanvas"></canvas>
  
  <script>
    // 高性能渲染引擎
    class HorizontalConnectionEngine {
      constructor() {
        this.canvas = null;
        this.ctx = null;
        this.connections = [];
        this.enabled = true;
        this.debugMode = false;
        this.optimizeMode = false;
        this.animationId = null;
        
        // 性能优化参数
        this.renderThrottle = 1;
        this.frameCounter = 0;
        this.visibilityThreshold = 50;
        
        this.init();
      }
      
      async init() {
        this.canvas = document.getElementById('performanceCanvas');
        if (!this.canvas) return;
        
        this.ctx = this.canvas.getContext('2d', {
          alpha: true,
          desynchronized: true,
          powerPreference: 'high-performance'
        });
        
        this.resizeCanvas();
        
        window.addEventListener('resize', () => {
          this.resizeCanvas();
        });
        
        this.log('✅ 横向连接引擎初始化完成');
      }
      
      resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        
        this.ctx.scale(dpr, dpr);
      }
      
      createConnections(count) {
        this.connections = [];
        
        for (let i = 0; i < count; i++) {
          const chatAvatar = document.querySelector(`[data-connection="chat-avatar-${i}"]`);
          const bubble = document.querySelector(`[data-connection="bubble-${i}"]`);
          const accountAvatar = document.querySelector(`[data-connection="account-avatar-${i}"]`);
          
          if (chatAvatar && bubble && accountAvatar) {
            this.connections.push({
              id: i,
              chatAvatar: chatAvatar,
              bubble: bubble,
              accountAvatar: accountAvatar,
              type: i % 3 === 2 ? 'self' : 'other',
              color: this.getConnectionColor(i),
              lastVisible: true
            });
          }
        }
        
        document.getElementById('connectionCount').textContent = this.connections.length;
        this.log(`🔗 创建了 ${this.connections.length} 个横向连接`);
      }
      
      getConnectionColor(index) {
        const hue = (index * 137) % 360;
        return `hsl(${hue}, 70%, 60%)`;
      }
      
      startRendering() {
        const render = () => {
          if (!this.enabled) return;
          
          this.frameCounter++;
          
          if (this.frameCounter % this.renderThrottle === 0) {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            if (this.optimizeMode) {
              this.drawVisibleConnections();
            } else {
              this.drawAllConnections();
            }
          }
          
          this.animationId = requestAnimationFrame(render);
        };
        
        render();
      }
      
      drawAllConnections() {
        this.connections.forEach(connection => {
          this.drawHorizontalConnection(connection);
        });
      }
      
      drawVisibleConnections() {
        const viewportHeight = window.innerHeight;
        let visibleCount = 0;
        
        this.connections.forEach(connection => {
          if (this.isConnectionVisible(connection, viewportHeight)) {
            this.drawHorizontalConnection(connection);
            connection.lastVisible = true;
            visibleCount++;
          } else {
            connection.lastVisible = false;
          }
        });
        
        document.getElementById('connectionCount').textContent = `${visibleCount}/${this.connections.length}`;
      }
      
      isConnectionVisible(connection, viewportHeight) {
        const bubbleRect = connection.bubble.getBoundingClientRect();
        const chatRect = connection.chatAvatar.getBoundingClientRect();
        const accountRect = connection.accountAvatar.getBoundingClientRect();
        
        const threshold = this.visibilityThreshold;
        return (
          (bubbleRect.top < viewportHeight + threshold && bubbleRect.bottom > -threshold) ||
          (chatRect.top < viewportHeight + threshold && chatRect.bottom > -threshold) ||
          (accountRect.top < viewportHeight + threshold && accountRect.bottom > -threshold)
        );
      }
      
      drawHorizontalConnection(connection) {
        // 横向容器布局的连接线：会话头像 ← 消息气泡 → 账号头像
        const bubbleRect = connection.bubble.getBoundingClientRect();
        const chatRect = connection.chatAvatar.getBoundingClientRect();
        const accountRect = connection.accountAvatar.getBoundingClientRect();
        
        if (!bubbleRect.width || !chatRect.width || !accountRect.width) return;
        
        const bubbleCenterY = bubbleRect.top + bubbleRect.height / 2;
        const chatCenterY = chatRect.top + chatRect.height / 2;
        const accountCenterY = accountRect.top + accountRect.height / 2;
        
        this.ctx.beginPath();
        this.ctx.strokeStyle = connection.color;
        this.ctx.lineWidth = 2;
        this.ctx.lineCap = 'round';
        
        // 绘制两条连接线：
        // 1. 会话头像 → 消息气泡
        this.drawLShapedPath(
          chatRect.right, chatCenterY,
          bubbleRect.left, bubbleCenterY,
          5, 6
        );
        
        // 2. 消息气泡 → 账号头像  
        this.drawLShapedPath(
          bubbleRect.right, bubbleCenterY,
          accountRect.left, accountCenterY,
          5, 6
        );
        
        this.ctx.stroke();
        
        // 调试模式
        if (this.debugMode && connection.id % 100 === 0) {
          this.drawDebugPoint(chatRect.right, chatCenterY, '#ff0000');
          this.drawDebugPoint(bubbleRect.left, bubbleCenterY, '#00ff00');
          this.drawDebugPoint(bubbleRect.right, bubbleCenterY, '#00ff00');
          this.drawDebugPoint(accountRect.left, accountCenterY, '#0000ff');
        }
      }
      
      drawLShapedPath(startX, startY, endX, endY, extension, cornerRadius) {
        const midX = startX + extension;
        
        // L型路径：起点 → 水平延伸 → 转折 → 终点
        this.ctx.moveTo(startX, startY);
        this.ctx.lineTo(midX, startY);
        this.ctx.lineTo(midX, endY);
        this.ctx.lineTo(endX, endY);
      }
      
      drawDebugPoint(x, y, color) {
        this.ctx.beginPath();
        this.ctx.fillStyle = color;
        this.ctx.arc(x, y, 2, 0, 2 * Math.PI);
        this.ctx.fill();
      }
      
      toggle() {
        this.enabled = !this.enabled;
        
        if (!this.enabled) {
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
          }
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          document.getElementById('systemStatus').textContent = '暂停';
          document.getElementById('systemStatus').className = 'perf-warning';
        } else {
          this.startRendering();
          document.getElementById('systemStatus').textContent = '运行中';
          document.getElementById('systemStatus').className = 'perf-value';
        }
        
        this.log(`🎨 横向连接渲染: ${this.enabled ? '启用' : '暂停'}`);
      }
      
      setOptimizeMode(enabled) {
        this.optimizeMode = enabled;
        this.renderThrottle = enabled ? 2 : 1;
        this.log(`⚡ 优化模式: ${enabled ? '启用' : '禁用'}`);
      }
      
      setDebugMode(enabled) {
        this.debugMode = enabled;
        document.body.classList.toggle('debug-mode', enabled);
        this.log(`🔍 调试模式: ${enabled ? '启用' : '禁用'}`);
      }
      
      log(message) {
        console.log(`[横向连接引擎] ${message}`);
      }
    }
    
    // 性能监控器
    class PerformanceMonitor {
      constructor() {
        this.frameCount = 0;
        this.lastTime = performance.now();
        this.fps = 0;
        this.frameTime = 0;
        
        this.updateInterval = setInterval(() => {
          this.updateMemoryUsage();
        }, 2000);
      }
      
      update() {
        this.frameCount++;
        const now = performance.now();
        
        if (now - this.lastTime >= 1000) {
          this.fps = Math.round(this.frameCount * 1000 / (now - this.lastTime));
          this.frameTime = Math.round((now - this.lastTime) / this.frameCount * 100) / 100;
          
          document.getElementById('fps').textContent = this.fps;
          document.getElementById('frameTime').textContent = this.frameTime;
          
          if (this.fps < 30) {
            document.getElementById('fps').className = 'perf-warning';
          } else {
            document.getElementById('fps').className = 'perf-value';
          }
          
          this.frameCount = 0;
          this.lastTime = now;
        }
      }
      
      updateMemoryUsage() {
        if (performance.memory) {
          const used = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
          document.getElementById('memoryUsage').textContent = used;
          
          if (used > 100) {
            document.getElementById('memoryUsage').className = 'perf-warning';
          } else {
            document.getElementById('memoryUsage').className = 'perf-value';
          }
        }
      }
    }
    
    // 主应用控制器
    class HorizontalMobileApp {
      constructor() {
        this.connectionEngine = new HorizontalConnectionEngine();
        this.perfMonitor = new PerformanceMonitor();
        this.elementsGenerated = false;
        this.autoScrollInterval = null;
        
        this.setupEventListeners();
        this.generateElements();
      }
      
      setupEventListeners() {
        document.getElementById('toggleRender').addEventListener('click', () => {
          this.connectionEngine.toggle();
          this.updateRenderButton();
        });
        
        document.getElementById('toggleDebug').addEventListener('click', () => {
          const enabled = document.body.classList.contains('debug-mode');
          this.connectionEngine.setDebugMode(!enabled);
          this.updateDebugButton();
        });
        
        document.getElementById('optimizeMode').addEventListener('click', () => {
          this.toggleOptimizeMode();
        });
        
        document.getElementById('autoScroll').addEventListener('click', () => {
          this.toggleAutoScroll();
        });
        
        document.getElementById('resetTest').addEventListener('click', () => {
          this.resetTest();
        });
      }
      
      async generateElements() {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingBar = document.getElementById('loadingBar');
        const loadingText = document.getElementById('loadingText');
        
        const count = 1000;
        const batchSize = 50;
        
        for (let batch = 0; batch < count / batchSize; batch++) {
          const start = batch * batchSize;
          const end = Math.min(start + batchSize, count);
          
          const progress = (end / count) * 100;
          loadingBar.style.width = progress + '%';
          loadingText.textContent = `生成元素 ${end}/${count}`;
          
          await this.generateBatch(start, end);
          await new Promise(resolve => setTimeout(resolve, 10));
        }
        
        this.setContainerHeights(count);
        
        loadingText.textContent = '创建连接线...';
        await new Promise(resolve => setTimeout(resolve, 100));
        this.connectionEngine.createConnections(count);
        
        this.connectionEngine.startRendering();
        this.startPerformanceMonitoring();
        
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 300);
        
        document.getElementById('systemStatus').textContent = '已就绪';
        this.elementsGenerated = true;
        
        console.log('🚀 横向布局1000个元素生成完成');
      }
      
      async generateBatch(start, end) {
        const chatContainer = document.getElementById('chatAvatarContent');
        const bubbleContainer = document.getElementById('messageBubbleContent');
        const accountContainer = document.getElementById('accountAvatarContent');
        
        for (let i = start; i < end; i++) {
          // 会话头像
          const chatAvatar = document.createElement('div');
          chatAvatar.className = 'chat-avatar';
          chatAvatar.style.background = `hsl(${(i * 137) % 360}, 70%, 50%)`;
          chatAvatar.setAttribute('data-connection', `chat-avatar-${i}`);
          chatAvatar.textContent = String.fromCharCode(65 + (i % 26));
          chatContainer.appendChild(chatAvatar);
          
          // 消息气泡
          const bubble = document.createElement('div');
          const isSelf = i % 3 === 2;
          bubble.className = `message-bubble ${isSelf ? 'bubble-self' : 'bubble-other'}`;
          bubble.setAttribute('data-connection', `bubble-${i}`);
          bubble.setAttribute('data-type', isSelf ? 'self' : 'other');
          bubble.textContent = `消息${i + 1}`;
          bubbleContainer.appendChild(bubble);
          
          // 账号头像
          const accountAvatar = document.createElement('div');
          accountAvatar.className = 'account-avatar';
          accountAvatar.style.background = `hsl(${(i * 137 + 30) % 360}, 70%, 45%)`;
          accountAvatar.setAttribute('data-connection', `account-avatar-${i}`);
          accountAvatar.textContent = String.fromCharCode(65 + (i % 26));
          accountContainer.appendChild(accountAvatar);
        }
      }
      
      setContainerHeights(count) {
        const elementHeight = 48; // 36px + 12px margin
        
        document.getElementById('chatAvatarContent').style.height = (count * elementHeight) + 'px';
        document.getElementById('messageBubbleContent').style.height = (count * elementHeight) + 'px';
        document.getElementById('accountAvatarContent').style.height = (count * elementHeight) + 'px';
      }
      
      updateRenderButton() {
        const btn = document.getElementById('toggleRender');
        const enabled = this.connectionEngine.enabled;
        
        btn.textContent = enabled ? '⏸️ 暂停' : '▶️ 继续';
        btn.style.background = enabled ? '#ef4444' : '#10b981';
      }
      
      updateDebugButton() {
        const btn = document.getElementById('toggleDebug');
        const enabled = document.body.classList.contains('debug-mode');
        
        btn.textContent = enabled ? '🔍 ON' : '🔍 OFF';
        btn.style.background = enabled ? '#3b82f6' : '#6b7280';
      }
      
      toggleOptimizeMode() {
        const btn = document.getElementById('optimizeMode');
        const enabled = this.connectionEngine.optimizeMode;
        
        this.connectionEngine.setOptimizeMode(!enabled);
        
        btn.textContent = !enabled ? '⚡ ON' : '⚡ OFF';
        btn.style.background = !enabled ? '#10b981' : '#f59e0b';
      }
      
      toggleAutoScroll() {
        if (this.autoScrollInterval) {
          clearInterval(this.autoScrollInterval);
          this.autoScrollInterval = null;
          
          document.getElementById('autoScroll').textContent = '📜 滚动';
          document.getElementById('autoScroll').style.background = '#8b5cf6';
          return;
        }
        
        document.getElementById('autoScroll').textContent = '⏸️ 停止';
        document.getElementById('autoScroll').style.background = '#ef4444';
        
        const containers = ['chatAvatarContainer', 'messageBubbleContainer', 'accountAvatarContainer'];
        let currentContainer = 0;
        let direction = 1;
        
        this.autoScrollInterval = setInterval(() => {
          const container = document.getElementById(containers[currentContainer]);
          const currentScroll = container.scrollTop;
          const maxScroll = container.scrollHeight - container.clientHeight;
          
          if (currentScroll >= maxScroll && direction > 0) {
            direction = -1;
          } else if (currentScroll <= 0 && direction < 0) {
            direction = 1;
            currentContainer = (currentContainer + 1) % containers.length;
          }
          
          container.scrollTop += direction * 3;
        }, 20);
      }
      
      resetTest() {
        if (this.autoScrollInterval) {
          clearInterval(this.autoScrollInterval);
          this.autoScrollInterval = null;
          document.getElementById('autoScroll').textContent = '📜 滚动';
          document.getElementById('autoScroll').style.background = '#8b5cf6';
        }
        
        ['chatAvatarContainer', 'messageBubbleContainer', 'accountAvatarContainer'].forEach(id => {
          document.getElementById(id).scrollTop = 0;
        });
        
        console.log('🔄 横向测试已重置');
      }
      
      startPerformanceMonitoring() {
        const monitor = () => {
          this.perfMonitor.update();
          requestAnimationFrame(monitor);
        };
        monitor();
      }
    }
    
    // 启动应用
    document.addEventListener('DOMContentLoaded', () => {
      const app = new HorizontalMobileApp();
      
      // 防止页面缩放和滚动
      document.addEventListener('gesturestart', e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend', e => e.preventDefault());
      document.addEventListener('touchmove', e => {
        // 只允许容器内的滚动
        if (!e.target.closest('.mobile-container')) {
          e.preventDefault();
        }
      }, { passive: false });
    });
    
  </script>
  
</body>
</html>
