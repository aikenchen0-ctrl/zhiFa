<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 气泡组件操作菜单测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(to bottom right, #dbeafe, #e0e7ff);
      min-height: 100vh;
      padding: 32px;
      color: #374151;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .container {
      max-width: 448px;
      margin: 0 auto 32px;
    }

    .space-y-4 > * + * {
      margin-top: 16px;
    }

    .bubble {
      position: relative;
      max-width: 100%;
      width: fit-content;
      padding: 6px;
      border-radius: 16px;
      transition: transform 0.2s ease;
      cursor: pointer;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .bubble:hover {
      transform: scale(1.01);
    }

    .bubble.sender-other {
      background: rgba(255, 255, 255, 0.1);
      margin-right: auto;
    }

    .bubble.sender-self {
      background: rgba(255, 255, 255, 0.35);
      margin-left: auto;
    }

    .bubble-content {
      position: relative;
    }

    .sender-name {
      position: absolute;
      left: 12px;
      top: 0;
      transform: translateY(-50%);
      z-index: 30;
      font-size: 0.75rem;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 
                   0 1px 4px rgba(0, 0, 0, 0.4), 
                   0 0px 2px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .message-text {
      color: white;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5),
                   0 1px 3px rgba(0, 0, 0, 0.4),
                   0 0px 1px rgba(0, 0, 0, 0.7);
    }

    .action-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px;
      display: none;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .action-menu.show {
      display: block;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .action-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      border: none;
      background: transparent;
      font-size: 0.75rem;
    }

    .action-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .action-icon {
      font-size: 1.25rem;
      margin-bottom: 2px;
    }

    .menu-arrow {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid rgba(255, 255, 255, 0.15);
    }

    .test-info {
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 32px;
    }

    .test-info p {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>🧪 气泡组件操作菜单测试</h1>
  
  <div class="container">
    <h2>📱 简单气泡测试</h2>
    
    <!-- 别人发送的简单气泡 -->
    <div class="bubble sender-other" onclick="toggleActionMenu(this)">
      <div class="bubble-content">
        <div class="message-text">这是一个测试消息，点击我应该能看到操作菜单</div>
        <div class="action-menu">
          <div class="action-grid">
            <button class="action-button" onclick="handleAction('aside', event)">
              <span class="action-icon">💭</span>
              <span>话外音</span>
            </button>
            <button class="action-button" onclick="handleAction('copy', event)">
              <span class="action-icon">📋</span>
              <span>复制</span>
            </button>
            <button class="action-button" onclick="handleAction('forward', event)">
              <span class="action-icon">📤</span>
              <span>转发</span>
            </button>
            <button class="action-button" onclick="handleAction('collect', event)">
              <span class="action-icon">⭐</span>
              <span>收藏</span>
            </button>
            <button class="action-button" onclick="handleAction('multi-select', event)">
              <span class="action-icon">✅</span>
              <span>多选</span>
            </button>
            <button class="action-button" onclick="handleAction('quote', event)">
              <span class="action-icon">💬</span>
              <span>引用</span>
            </button>
            <button class="action-button" onclick="handleAction('enlarge', event)">
              <span class="action-icon">🔍</span>
              <span>放大</span>
            </button>
            <button class="action-button" onclick="handleAction('delete', event)">
              <span class="action-icon">🗑️</span>
              <span>删除</span>
            </button>
          </div>
          <div class="menu-arrow"></div>
        </div>
      </div>
    </div>
    
    <!-- 自己发送的简单气泡 -->
    <div class="bubble sender-self" onclick="toggleActionMenu(this)">
      <div class="bubble-content">
        <div class="message-text">这是我发送的消息</div>
        <div class="action-menu">
          <div class="action-grid">
            <button class="action-button" onclick="handleAction('aside', event)">
              <span class="action-icon">💭</span>
              <span>话外音</span>
            </button>
            <button class="action-button" onclick="handleAction('copy', event)">
              <span class="action-icon">📋</span>
              <span>复制</span>
            </button>
            <button class="action-button" onclick="handleAction('forward', event)">
              <span class="action-icon">📤</span>
              <span>转发</span>
            </button>
            <button class="action-button" onclick="handleAction('collect', event)">
              <span class="action-icon">⭐</span>
              <span>收藏</span>
            </button>
            <button class="action-button" onclick="handleAction('multi-select', event)">
              <span class="action-icon">✅</span>
              <span>多选</span>
            </button>
            <button class="action-button" onclick="handleAction('quote', event)">
              <span class="action-icon">💬</span>
              <span>引用</span>
            </button>
            <button class="action-button" onclick="handleAction('enlarge', event)">
              <span class="action-icon">🔍</span>
              <span>放大</span>
            </button>
            <button class="action-button" onclick="handleAction('delete', event)">
              <span class="action-icon">🗑️</span>
              <span>删除</span>
            </button>
          </div>
          <div class="menu-arrow"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>👤 详细气泡测试</h2>
    
    <!-- 别人发送的详细气泡 -->
    <div class="bubble sender-other" onclick="toggleActionMenu(this)">
      <div class="bubble-content">
        <div class="sender-name">张三</div>
        <div class="message-text">这是一个测试消息，点击我应该能看到操作菜单</div>
        <div class="action-menu">
          <div class="action-grid">
            <button class="action-button" onclick="handleAction('aside', event)">
              <span class="action-icon">💭</span>
              <span>话外音</span>
            </button>
            <button class="action-button" onclick="handleAction('copy', event)">
              <span class="action-icon">📋</span>
              <span>复制</span>
            </button>
            <button class="action-button" onclick="handleAction('forward', event)">
              <span class="action-icon">📤</span>
              <span>转发</span>
            </button>
            <button class="action-button" onclick="handleAction('collect', event)">
              <span class="action-icon">⭐</span>
              <span>收藏</span>
            </button>
            <button class="action-button" onclick="handleAction('multi-select', event)">
              <span class="action-icon">✅</span>
              <span>多选</span>
            </button>
            <button class="action-button" onclick="handleAction('quote', event)">
              <span class="action-icon">💬</span>
              <span>引用</span>
            </button>
            <button class="action-button" onclick="handleAction('enlarge', event)">
              <span class="action-icon">🔍</span>
              <span>放大</span>
            </button>
            <button class="action-button" onclick="handleAction('delete', event)">
              <span class="action-icon">🗑️</span>
              <span>删除</span>
            </button>
          </div>
          <div class="menu-arrow"></div>
        </div>
      </div>
    </div>
    
    <!-- 自己发送的详细气泡（带发送者名字示例） -->
    <div class="bubble sender-self" onclick="toggleActionMenu(this)">
      <div class="bubble-content">
        <div class="sender-name">我</div>
        <div class="message-text">这是我发送的消息</div>
        <div class="action-menu">
          <div class="action-grid">
            <button class="action-button" onclick="handleAction('aside', event)">
              <span class="action-icon">💭</span>
              <span>话外音</span>
            </button>
            <button class="action-button" onclick="handleAction('copy', event)">
              <span class="action-icon">📋</span>
              <span>复制</span>
            </button>
            <button class="action-button" onclick="handleAction('forward', event)">
              <span class="action-icon">📤</span>
              <span>转发</span>
            </button>
            <button class="action-button" onclick="handleAction('collect', event)">
              <span class="action-icon">⭐</span>
              <span>收藏</span>
            </button>
            <button class="action-button" onclick="handleAction('multi-select', event)">
              <span class="action-icon">✅</span>
              <span>多选</span>
            </button>
            <button class="action-button" onclick="handleAction('quote', event)">
              <span class="action-icon">💬</span>
              <span>引用</span>
            </button>
            <button class="action-button" onclick="handleAction('enlarge', event)">
              <span class="action-icon">🔍</span>
              <span>放大</span>
            </button>
            <button class="action-button" onclick="handleAction('delete', event)">
              <span class="action-icon">🗑️</span>
              <span>删除</span>
            </button>
          </div>
          <div class="menu-arrow"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="test-info">
    <p>✅ 如果你能看到操作菜单并且点击有响应，说明组件工作正常</p>
    <p>❌ 如果点击气泡没有反应，说明还有问题需要修复</p>
  </div>

  <script>
    function toggleActionMenu(bubbleElement) {
      // 关闭所有其他菜单
      document.querySelectorAll('.action-menu.show').forEach(menu => {
        if (menu !== bubbleElement.querySelector('.action-menu')) {
          menu.classList.remove('show');
        }
      });

      // 切换当前菜单
      const menu = bubbleElement.querySelector('.action-menu');
      menu.classList.toggle('show');
    }

    function handleAction(action, event) {
      event.stopPropagation(); // 防止冒泡触发气泡点击
      
      const message = event.target.closest('.bubble').querySelector('.message-text').textContent;
      
      console.log('🎯 操作菜单点击:', { action, content: message });
      
      switch (action) {
        case 'copy':
          navigator.clipboard.writeText(message);
          alert(`✅ 已复制消息: ${message}`);
          break;
        case 'delete':
          alert(`🗑️ 删除消息: ${message}`);
          break;
        case 'forward':
          alert(`📤 转发消息: ${message}`);
          break;
        case 'collect':
          alert(`⭐ 收藏消息: ${message}`);
          break;
        case 'quote':
          alert(`💬 引用消息: ${message}`);
          break;
        case 'aside':
          alert(`💭 话外音: ${message}`);
          break;
        case 'enlarge':
          alert(`🔍 放大消息: ${message}`);
          break;
        case 'multi-select':
          alert(`✅ 多选模式`);
          break;
        default:
          alert(`❓ 未知操作: ${action}`);
      }

      // 点击动作后关闭菜单
      event.target.closest('.action-menu').classList.remove('show');
    }

    // 点击其他地方关闭菜单
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.bubble')) {
        document.querySelectorAll('.action-menu.show').forEach(menu => {
          menu.classList.remove('show');
        });
      }
    });
  </script>
</body>
</html>
