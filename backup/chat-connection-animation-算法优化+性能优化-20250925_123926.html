<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接线算法优化版 - 数学优化与性能提升</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* 聊天界面容器 */
        .chat-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题栏 */
        .chat-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* 主聊天区域 */
        .chat-main {
            flex: 1;
            position: relative;
            display: flex;
            overflow: hidden;
        }

        /* 左侧会话列表 */
        .conversation-sidebar {
            width: 200px;
            background: rgba(102, 126, 234, 0.1);
            border-right: 1px solid rgba(102, 126, 234, 0.2);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 会话头像 */
        .conversation-avatar {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto;
            background: linear-gradient(45deg, #00ff88, #00bcd4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .conversation-avatar:hover {
            transform: scale(1.1) translateZ(0);
            will-change: transform;
        }

        /* 中间消息区域 */
        .message-area {
            flex: 1;
            position: relative;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            min-height: 0;
        }

        /* 消息气泡（硬件加速优化） */
        .message-bubble {
            position: relative;
            max-width: 350px;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 左侧发送的消息 */
        .message-left {
            background: linear-gradient(45deg, #00ff88, #00bcd4);
            color: white;
            align-self: flex-start;
            margin-left: 0;
            border-bottom-left-radius: 5px;
        }

        /* 右侧发送的消息 */
        .message-right {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            align-self: flex-end;
            margin-right: 0;
            border-bottom-right-radius: 5px;
        }

        /* 右侧工具和账号区域 */
        .right-sidebar {
            width: 180px;
            background: rgba(118, 75, 162, 0.1);
            border-left: 1px solid rgba(118, 75, 162, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        /* 账号头像区域 */
        .account-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .account-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        /* 工具列区域 */
        .tools-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .tool-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(45deg, #9c27b0, #e91e63);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .tool-icon:hover {
            transform: scale(1.1) translateZ(0);
            will-change: transform;
        }

        /* SVG连接线容器 - 硬件加速优化 */
        .connection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            will-change: transform;
            transform: translateZ(0); /* 强制硬件加速 */
        }

        .connection-svg {
            width: 100%;
            height: 100%;
            will-change: contents;
            transform: translate3d(0, 0, 0); /* 启用硬件合成层 */
        }

        /* 基础连接线样式 */
        .base-connection {
            stroke: rgba(102, 126, 234, 0.3);
            stroke-width: 2;
            fill: transparent;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* 调试点样式 */
        .debug-point {
            opacity: 0.9;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        
        .debug-point:hover {
            opacity: 1;
            stroke-width: 2;
        }
        
        /* 调试标签样式 */
        .debug-label {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            fill: #333;
            pointer-events: none;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.8);
        }

        /* 左侧会话连接线 - 绿色光线（硬件加速优化） */
        .left-connection {
            stroke: #00ff88;
            stroke-width: 3;
            fill: transparent;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60, 300;
            stroke-dashoffset: 0;
            animation: light-flow-left 4s infinite linear;
            filter: drop-shadow(0 0 8px #00ff88) drop-shadow(0 0 16px rgba(0, 255, 136, 0.6));
            will-change: stroke-dashoffset;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 右侧账号连接线 - 橙色光线（硬件加速优化） */
        .right-connection {
            stroke: #ff6b35;
            stroke-width: 3;
            fill: transparent;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50, 280;
            stroke-dashoffset: 0;
            animation: light-flow-right 3.5s infinite linear;
            animation-delay: -1s;
            filter: drop-shadow(0 0 8px #ff6b35) drop-shadow(0 0 16px rgba(255, 107, 53, 0.6));
            will-change: stroke-dashoffset;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 右侧工具连接线 - 紫色光线（硬件加速优化） */
        .tool-connection {
            stroke: #9c27b0;
            stroke-width: 2.5;
            fill: transparent;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 40, 250;
            stroke-dashoffset: 0;
            animation: light-flow-tool 3s infinite linear;
            animation-delay: -2s;
            filter: drop-shadow(0 0 6px #9c27b0) drop-shadow(0 0 12px rgba(156, 39, 176, 0.6));
            will-change: stroke-dashoffset;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 左侧连接线动画 */
        @keyframes light-flow-left {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -360; }
        }

        /* 右侧账号连接线动画 */
        @keyframes light-flow-right {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -330; }
        }

        /* 工具连接线动画 */
        @keyframes light-flow-tool {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -290; }
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .control-btn {
            padding: 8px 16px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .control-btn:hover {
            transform: translateY(-2px) translateZ(0);
            will-change: transform;
        }

        /* 技术信息面板 */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 0.85rem;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }

        .info-panel h4 {
            color: #00ff88;
            margin-bottom: 10px;
        }

        .path-info {
            margin-bottom: 8px;
        }

        .path-info .label {
            color: #ff6b35;
            font-weight: bold;
        }
        
        /* 性能指标面板 */
        .performance-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 0.8rem;
            line-height: 1.3;
            backdrop-filter: blur(10px);
        }
        
        .perf-metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .perf-value {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 顶部标题 -->
        <div class="chat-header">
            连接线算法优化版 - 数学优化与性能提升
        </div>

        <div class="chat-main">
            <!-- 左侧会话列表 -->
            <div class="conversation-sidebar">
                <div class="conversation-avatar" id="conversation-avatar-1" data-connection="left-1">A</div>
                <div class="conversation-avatar" id="conversation-avatar-2" data-connection="left-2">B</div>
                <div class="conversation-avatar" id="conversation-avatar-3" data-connection="left-3">C</div>
            </div>

            <!-- 中间消息区域 -->
            <div class="message-area" id="message-area">
                <!-- 50个测试消息 -->
            </div>

            <!-- 右侧账号和工具区域 -->
            <div class="right-sidebar">
                <!-- 账号头像区域 -->
                <div class="account-section">
                    <div class="account-avatar" id="account-avatar">U</div>
                    <div style="font-size: 0.9rem; color: #666;">账号头像</div>
                </div>

                <!-- 工具列区域 -->
                <div class="tools-section">
                    <div class="tool-icon" id="tool-1">🔧</div>
                    <div class="tool-icon" id="tool-2">📊</div>
                    <div class="tool-icon" id="tool-3">⚙️</div>
                </div>
            </div>
        </div>

        <!-- SVG连接线覆盖层（SVG渲染优化） -->
        <div class="connection-overlay">
            <svg class="connection-svg" 
                 xmlns="http://www.w3.org/2000/svg" 
                 id="connection-svg"
                 viewBox="0 0 1200 800"
                 preserveAspectRatio="none"
                 shape-rendering="optimizeSpeed"
                 text-rendering="optimizeSpeed">
                <!-- 动态生成的连接路径将插入这里 -->
            </svg>
        </div>

        <!-- 技术信息面板 -->
        <div class="info-panel">
            <h4>🚀 算法优化版本特性</h4>
            <div class="path-info">
                <span class="label">预计算常量:</span> 减少运行时计算开销
            </div>
            <div class="path-info">
                <span class="label">对象池模式:</span> 减少GC压力，提升内存效率
            </div>
            <div class="path-info">
                <span class="label">增量更新:</span> 仅更新变化的连接线
            </div>
            <div class="path-info">
                <span class="label">向量化计算:</span> 批量处理坐标运算
            </div>
            <div class="path-info">
                <span class="label">早期退出:</span> 优化简单路径情况
            </div>
        </div>

        <!-- 性能指标面板 -->
        <div class="performance-panel" id="performance-panel">
            <h4 style="color: #ff6b35; margin-bottom: 10px;">📊 性能监控</h4>
            <div class="perf-metric">
                <span>路径生成时间:</span>
                <span class="perf-value" id="generation-time">--</span>
            </div>
            <div class="perf-metric">
                <span>更新频率:</span>
                <span class="perf-value" id="update-fps">--</span>
            </div>
            <div class="perf-metric">
                <span>内存使用:</span>
                <span class="perf-value" id="memory-usage">--</span>
            </div>
            <div class="perf-metric">
                <span>缓存命中率:</span>
                <span class="perf-value" id="cache-hit-rate">--</span>
            </div>
            <div class="perf-metric">
                <span>对象池利用率:</span>
                <span class="perf-value" id="pool-usage">--</span>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <button class="control-btn" onclick="toggleAnimation()">暂停/播放</button>
            <button class="control-btn" onclick="changeSpeed()">调速</button>
            <button class="control-btn" onclick="highlightPath()">高亮路径</button>
            <button class="control-btn" onclick="toggleDebugPoints()">调试点</button>
            <button class="control-btn" onclick="benchmarkPerformance()">性能测试</button>
        </div>
    </div>

    <script>
        // 🚀 优化版算法核心类
        
        // 1. 预计算常量表 - 减少运行时计算
        const OPTIMIZED_CONSTANTS = {
            RADIUS: 5,
            EXTEND_TABLE: {
                'left-to-right': 10,   // |(-15)| - 5 = 10
                'right-to-left': 15,   // |20| - 5 = 15  
                'right-to-right': 10   // |15| - 5 = 10
            },
            CENTER_OFFSET_TABLE: {
                'left-to-right': -15,
                'right-to-left': 20,
                'right-to-right': 15
            },
            ANIMATION_CONFIGS: {
                'left-to-right': { color: '#00ff88', duration: 4, dashArray: '60,300', class: 'left-connection' },
                'right-to-left': { color: '#ff6b35', duration: 3.5, dashArray: '50,280', class: 'right-connection' },
                'right-to-right': { color: '#9c27b0', duration: 3, dashArray: '40,250', class: 'tool-connection' }
            }
        };

        // 2. 对象池模式 - 减少GC压力
        class ObjectPool {
            constructor(createFn, resetFn, initialSize = 20) {
                this.createFn = createFn;
                this.resetFn = resetFn;
                this.pool = [];
                this.active = new Set();
                
                // 预创建对象
                for (let i = 0; i < initialSize; i++) {
                    this.pool.push(this.createFn());
                }
            }
            
            acquire() {
                let obj = this.pool.pop();
                if (!obj) {
                    obj = this.createFn();
                }
                this.active.add(obj);
                return obj;
            }
            
            release(obj) {
                this.active.delete(obj);
                this.resetFn(obj);
                if (this.pool.length < 50) { // 限制池大小
                    this.pool.push(obj);
                }
            }
            
            getUsage() {
                return {
                    active: this.active.size,
                    pooled: this.pool.length,
                    utilization: this.active.size / (this.active.size + this.pool.length)
                };
            }
        }

        // 3. 路径数据对象池
        const pathPool = new ObjectPool(
            () => ({ path: '', debugPoints: {}, type: '' }),
            (obj) => { obj.path = ''; obj.debugPoints = {}; obj.type = ''; }
        );

        // 4. 缓存系统 - 避免重复计算
        class PathCache {
            constructor(maxSize = 1000) {
                this.cache = new Map();
                this.maxSize = maxSize;
                this.hits = 0;
                this.misses = 0;
            }
            
            key(startX, startY, endX, endY, type) {
                // 使用粗精度减少缓存键数量
                const precision = 10;
                return `${Math.round(startX/precision)*precision},${Math.round(startY/precision)*precision},${Math.round(endX/precision)*precision},${Math.round(endY/precision)*precision},${type}`;
            }
            
            get(startX, startY, endX, endY, type) {
                const k = this.key(startX, startY, endX, endY, type);
                if (this.cache.has(k)) {
                    this.hits++;
                    return this.cache.get(k);
                }
                this.misses++;
                return null;
            }
            
            set(startX, startY, endX, endY, type, value) {
                const k = this.key(startX, startY, endX, endY, type);
                
                // LRU淘汰
                if (this.cache.size >= this.maxSize) {
                    const firstKey = this.cache.keys().next().value;
                    this.cache.delete(firstKey);
                }
                
                this.cache.set(k, value);
            }
            
            getHitRate() {
                const total = this.hits + this.misses;
                return total > 0 ? (this.hits / total * 100).toFixed(1) : '0.0';
            }
        }

        const pathCache = new PathCache();

        // 5. 性能监控器
        class PerformanceMonitor {
            constructor() {
                this.metrics = {
                    generationTimes: [],
                    updateTimes: [],
                    memorySnapshots: []
                };
                this.lastUpdate = performance.now();
                this.frameCount = 0;
            }
            
            startTiming(operation) {
                return performance.now();
            }
            
            endTiming(operation, startTime) {
                const duration = performance.now() - startTime;
                if (!this.metrics[operation]) {
                    this.metrics[operation] = [];
                }
                this.metrics[operation].push(duration);
                
                // 保留最近100个记录
                if (this.metrics[operation].length > 100) {
                    this.metrics[operation].shift();
                }
                
                return duration;
            }
            
            recordFrame() {
                this.frameCount++;
                const now = performance.now();
                if (now - this.lastUpdate >= 1000) {
                    const fps = this.frameCount / ((now - this.lastUpdate) / 1000);
                    this.updateUI('update-fps', fps.toFixed(1) + ' FPS');
                    this.frameCount = 0;
                    this.lastUpdate = now;
                }
            }
            
            updateUI(elementId, value) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = value;
                }
            }
            
            getAverageTime(operation) {
                const times = this.metrics[operation] || [];
                if (times.length === 0) return 0;
                return times.reduce((sum, time) => sum + time, 0) / times.length;
            }
        }

        const perfMonitor = new PerformanceMonitor();

        // 6. 优化的路径计算函数
        function createOptimizedConnectionPath(startX, startY, endX, endY, type) {
            const startTime = perfMonitor.startTiming('generationTimes');
            
            // 早期退出优化 - 处理简单情况
            if (Math.abs(startY - endY) < 2) {
                const result = pathPool.acquire();
                result.path = `M ${startX} ${startY} L ${endX} ${endY}`;
                result.type = type;
                result.debugPoints = {
                    start: { x: startX, y: startY, label: '起点', color: '#ff0000' },
                    end: { x: endX, y: endY, label: '终点', color: '#ff00aa' }
                };
                perfMonitor.endTiming('generationTimes', startTime);
                return result;
            }
            
            // 缓存检查
            const cached = pathCache.get(startX, startY, endX, endY, type);
            if (cached) {
                perfMonitor.endTiming('generationTimes', startTime);
                return cached;
            }
            
            // 从预计算表获取常量
            const radius = OPTIMIZED_CONSTANTS.RADIUS;
            const extend = OPTIMIZED_CONSTANTS.EXTEND_TABLE[type];
            const centerOffset = OPTIMIZED_CONSTANTS.CENTER_OFFSET_TABLE[type];
            
            // 向量化计算基础参数
            const centerX = startX + centerOffset;
            const directions = [
                endY > startY ? 1 : -1,  // verticalDirection
                endX > centerX ? 1 : -1  // horizontalDirection
            ];
            
            // 批量计算所有坐标点
            const coords = calculatePathCoordinates(startX, startY, endX, endY, centerX, extend, radius, directions, type);
            
            // 生成SVG路径
            const pathData = `M ${coords[0]} ${coords[1]} L ${coords[2]} ${coords[3]} Q ${coords[4]} ${coords[5]} ${coords[6]} ${coords[7]} L ${coords[8]} ${coords[9]} Q ${coords[10]} ${coords[11]} ${coords[12]} ${coords[13]} L ${coords[14]} ${coords[15]}`;
            
            const result = pathPool.acquire();
            result.path = pathData;
            result.type = type;
            result.debugPoints = createDebugPoints(coords, type);
            
            // 缓存结果
            pathCache.set(startX, startY, endX, endY, type, result);
            
            const duration = perfMonitor.endTiming('generationTimes', startTime);
            perfMonitor.updateUI('generation-time', duration.toFixed(2) + 'ms');
            
            return result;
        }

        // 7. 向量化坐标计算（SVG渲染优化版）
        function calculatePathCoordinates(startX, startY, endX, endY, centerX, extend, radius, directions, type) {
            const [verticalDir, horizontalDir] = directions;
            
            // 使用TypedArray提高计算性能
            const coords = new Float32Array(16); // 8个点，每个点2个坐标
            
            // 精度优化函数 - 减少SVG路径数据量
            const optimizePrecision = (value) => Math.round(value * 100) / 100;
            
            // 批量计算所有坐标并优化精度
            coords[0] = optimizePrecision(startX);                                    // step1X
            coords[1] = optimizePrecision(startY);                                    // step1Y
            coords[2] = optimizePrecision(startX + (type === 'left-to-right' ? -extend : extend)); // step2X
            coords[3] = optimizePrecision(startY);                                    // step2Y
            coords[4] = optimizePrecision(centerX);                                   // turn1CenterX
            coords[5] = optimizePrecision(startY);                                    // turn1CenterY
            coords[6] = optimizePrecision(centerX);                                   // step3X
            coords[7] = optimizePrecision(startY + (verticalDir * radius));          // step3Y
            coords[8] = optimizePrecision(centerX);                                   // step4X
            coords[9] = optimizePrecision(endY + radius);                             // step4Y
            coords[10] = optimizePrecision(centerX);                                  // turn2CenterX
            coords[11] = optimizePrecision(endY);                                     // turn2CenterY
            coords[12] = optimizePrecision(centerX + (horizontalDir * radius));      // step5X (优化后的对称点)
            coords[13] = optimizePrecision(endY);                                     // step5Y
            coords[14] = optimizePrecision(endX);                                     // step6X
            coords[15] = optimizePrecision(endY);                                     // step6Y
            
            return coords;
        }

        // 9. 增量更新系统
        class IncrementalUpdater {
            constructor() {
                this.lastPositions = new Map();
                this.threshold = 1.0; // 像素阈值
            }
            
            shouldUpdate(elementId, newBounds) {
                const last = this.lastPositions.get(elementId);
                if (!last) {
                    this.lastPositions.set(elementId, newBounds);
                    return true;
                }
                
                const changed = Math.abs(last.centerX - newBounds.centerX) > this.threshold ||
                              Math.abs(last.centerY - newBounds.centerY) > this.threshold ||
                              Math.abs(last.left - newBounds.left) > this.threshold ||
                              Math.abs(last.top - newBounds.top) > this.threshold;
                
                if (changed) {
                    this.lastPositions.set(elementId, newBounds);
                }
                
                return changed;
            }
        }

        const incrementalUpdater = new IncrementalUpdater();

        // 获取元素相对于SVG容器的精确位置（复用原函数）
        function getElementPosition(element) {
            const svgContainer = document.querySelector('.connection-overlay');
            const containerRect = svgContainer.getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            
            return {
                left: elementRect.left - containerRect.left,
                top: elementRect.top - containerRect.top,
                right: elementRect.right - containerRect.left,
                bottom: elementRect.bottom - containerRect.top,
                centerX: (elementRect.left + elementRect.right) / 2 - containerRect.left,
                centerY: (elementRect.top + elementRect.bottom) / 2 - containerRect.top,
                width: elementRect.width,
                height: elementRect.height
            };
        }

        // 创建SVG路径元素
        function createPathElement(pathData, className, animationClass) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathData);
            path.setAttribute('class', className);
            if (animationClass) {
                path.classList.add(animationClass);
            }
            return path;
        }

        // 11. 视口优化器 - 懒加载和视口外元素管理
        class ViewportOptimizer {
            constructor() {
                this.viewportBounds = this.getViewportBounds();
                this.buffer = 100; // 视口外缓冲区大小
                this.observer = null;
                this.setupIntersectionObserver();
            }
            
            getViewportBounds() {
                const overlay = document.querySelector('.connection-overlay');
                return overlay ? overlay.getBoundingClientRect() : { top: 0, left: 0, right: window.innerWidth, bottom: window.innerHeight };
            }
            
            setupIntersectionObserver() {
                if ('IntersectionObserver' in window) {
                    this.observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            const isVisible = entry.isIntersecting || entry.intersectionRatio > 0;
                            this.toggleElementVisibility(entry.target, isVisible);
                        });
                    }, {
                        rootMargin: `${this.buffer}px`,
                        threshold: [0, 0.1, 0.5, 1.0]
                    });
                }
            }
            
            isInViewport(element) {
                const rect = element.getBoundingClientRect();
                const vp = this.viewportBounds;
                return !(rect.right < vp.left - this.buffer || 
                        rect.left > vp.right + this.buffer || 
                        rect.bottom < vp.top - this.buffer || 
                        rect.top > vp.bottom + this.buffer);
            }
            
            toggleElementVisibility(element, visible) {
                if (visible) {
                    element.style.display = '';
                    element.style.willChange = 'stroke-dashoffset';
                } else {
                    element.style.display = 'none';
                    element.style.willChange = 'auto'; // 清理will-change节省内存
                }
            }
            
            observeElement(element) {
                if (this.observer) {
                    this.observer.observe(element);
                }
            }
        }

        const viewportOptimizer = new ViewportOptimizer();

        // 12. requestAnimationFrame动画时序优化器
        class AnimationTimingOptimizer {
            constructor() {
                this.animationId = null;
                this.lastTimestamp = 0;
                this.animatedElements = new Set();
                this.isRunning = false;
                this.targetFPS = 60;
                this.frameInterval = 1000 / this.targetFPS;
                this.animations = new Map();
            }
            
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.animate();
                }
            }
            
            stop() {
                this.isRunning = false;
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }
            
            animate(timestamp = performance.now()) {
                if (!this.isRunning) return;
                
                const elapsed = timestamp - this.lastTimestamp;
                
                if (elapsed >= this.frameInterval) {
                    // 更新所有活跃的动画
                    this.updateAnimations(timestamp);
                    this.lastTimestamp = timestamp;
                    
                    // 更新性能监控
                    perfMonitor.recordFrame();
                }
                
                this.animationId = requestAnimationFrame(this.animate.bind(this));
            }
            
            updateAnimations(timestamp) {
                this.animations.forEach((animation, element) => {
                    if (element && element.parentNode) { // 检查DOM是否还存在
                        const progress = (timestamp - animation.startTime) % animation.duration / animation.duration;
                        const offset = animation.startOffset + (progress * animation.range);
                        element.style.strokeDashoffset = -offset;
                    } else {
                        // 清理已删除的DOM元素
                        this.animations.delete(element);
                    }
                });
            }
            
            registerAnimation(element, config) {
                if (element && element.parentNode) {
                    this.animations.set(element, {
                        startTime: performance.now(),
                        duration: config.duration * 1000, // 转换为毫秒
                        startOffset: 0,
                        range: config.dashArray ? parseInt(config.dashArray.split(',')[0]) + parseInt(config.dashArray.split(',')[1]) : 360,
                        delay: config.delay || 0
                    });
                }
            }
            
            unregisterAnimation(element) {
                this.animations.delete(element);
            }
        }

        // 13. 内存泄漏防护和DOM节点回收机制
        class MemoryLeakProtector {
            constructor() {
                this.observers = new Set();
                this.eventListeners = new Map();
                this.timers = new Set();
                this.animationFrames = new Set();
                this.domReferences = new WeakSet();
                this.cleanupCallbacks = [];
                
                // 页面卸载时自动清理
                window.addEventListener('beforeunload', this.cleanup.bind(this));
            }
            
            trackObserver(observer) {
                this.observers.add(observer);
            }
            
            trackEventListener(element, event, handler) {
                if (!this.eventListeners.has(element)) {
                    this.eventListeners.set(element, new Map());
                }
                this.eventListeners.get(element).set(event, handler);
            }
            
            trackTimer(timerId) {
                this.timers.add(timerId);
            }
            
            trackAnimationFrame(frameId) {
                this.animationFrames.add(frameId);
            }
            
            trackDOMReference(element) {
                this.domReferences.add(element);
            }
            
            addCleanupCallback(callback) {
                this.cleanupCallbacks.push(callback);
            }
            
            cleanup() {
                // 清理所有观察者
                this.observers.forEach(observer => {
                    if (observer && observer.disconnect) {
                        observer.disconnect();
                    }
                });
                this.observers.clear();
                
                // 清理事件监听器
                this.eventListeners.forEach((events, element) => {
                    events.forEach((handler, event) => {
                        if (element && element.removeEventListener) {
                            element.removeEventListener(event, handler);
                        }
                    });
                });
                this.eventListeners.clear();
                
                // 清理定时器
                this.timers.forEach(timerId => {
                    clearTimeout(timerId);
                    clearInterval(timerId);
                });
                this.timers.clear();
                
                // 清理动画帧
                this.animationFrames.forEach(frameId => {
                    cancelAnimationFrame(frameId);
                });
                this.animationFrames.clear();
                
                // 执行清理回调
                this.cleanupCallbacks.forEach(callback => {
                    try {
                        callback();
                    } catch (e) {
                        console.warn('清理回调执行失败:', e);
                    }
                });
                this.cleanupCallbacks = [];
                
                console.log('🧹 内存清理完成');
            }
            
            checkMemoryUsage() {
                if (performance.memory) {
                    const usage = performance.memory.usedJSHeapSize / 1024 / 1024;
                    if (usage > 100) { // 超过100MB警告
                        console.warn(`⚠️ 内存使用量过高: ${usage.toFixed(2)}MB`);
                        return false;
                    }
                }
                return true;
            }
        }

        const animationOptimizer = new AnimationTimingOptimizer();

        // 优化的连接线生成函数（懒加载和视口优化版）
        function generateOptimizedConnections() {

            leftMessages.forEach((leftMsg, index) => {

                if (avatar && incrementalUpdater.shouldUpdate(leftMsg.id, getElementPosition(leftMsg))) {

                    connectionConfigs.push({

                        animationClass: 'left-connection',
                        startElement: leftMsg,
                        endElement: avatar
                    });
                }
            });
            
            // 批量处理右侧连接
            rightMessages.forEach((rightMsg, index) => {
                if (!incrementalUpdater.shouldUpdate(rightMsg.id, getElementPosition(rightMsg))) {
                    return;
                }
                
                const msgPos = getElementPosition(rightMsg);
                
                if (index % 2 === 0 && accountAvatar) {
                    const avatarPos = getElementPosition(accountAvatar);
                    connectionConfigs.push({
                        name: `右侧消息${index + 1}到账号头像`,
                        start: { x: msgPos.right, y: msgPos.centerY },
                        end: { x: avatarPos.left, y: avatarPos.centerY },
                        type: 'right-to-left',
                        animationClass: 'right-connection',
                        startElement: rightMsg,
                        endElement: accountAvatar
                    });
                } else {
                    const toolIndex = index % tools.length;
                    const tool = tools[toolIndex];
                    
                    if (tool) {
                        const toolPos = getElementPosition(tool);
                        connectionConfigs.push({
                            name: `右侧消息${index + 1}到工具${toolIndex + 1}`,
                            start: { x: msgPos.right, y: msgPos.centerY },
                            end: { x: toolPos.left, y: toolPos.centerY },
                            type: 'right-to-right',
                            animationClass: 'tool-connection',
                            startElement: rightMsg,
                            endElement: tool
                        });
                    }
                }
            });

            storedConnectionConfigs = [...connectionConfigs];
            
            // 批量生成所有连接线
            connectionConfigs.forEach((config, index) => {
                const result = createOptimizedConnectionPath(
                    config.start.x, config.start.y,
                    config.end.x, config.end.y,
                    config.type
                );
                
                // 视口检查 - 只渲染视口内或接近的连接线
                if (viewportOptimizer.isInViewport(config.startElement) || viewportOptimizer.isInViewport(config.endElement)) {
                    // 创建基础路径
                    const basePath = createPathElement(result.path, 'base-connection');
                    fragment.appendChild(basePath);
                    
                    // 创建动画路径并注册到动画优化器
                    const animatedPath = createPathElement(result.path, 'base-connection', config.animationClass);
                    fragment.appendChild(animatedPath);
                    
                    // 注册到requestAnimationFrame动画系统
                    const animConfig = OPTIMIZED_CONSTANTS.ANIMATION_CONFIGS[config.type];
                    animationOptimizer.registerAnimation(animatedPath, {
                        duration: animConfig.duration,
                        dashArray: animConfig.dashArray,
                        delay: config.type === 'right-to-left' ? 1 : (config.type === 'right-to-right' ? 2 : 0)
                    });
                    
                    // 设置视口观察并注册到内存保护
                    viewportOptimizer.observeElement(basePath);
                    viewportOptimizer.observeElement(animatedPath);
                    memoryProtector.trackDOMReference(basePath);
                    memoryProtector.trackDOMReference(animatedPath);
                    
                    // 创建调试点（仅在视口内）
                    Object.entries(result.debugPoints).forEach(([key, point]) => {
                        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        circle.setAttribute('cx', point.x);
                        circle.setAttribute('cy', point.y);
                        circle.setAttribute('r', key.includes('Control') ? '6' : '4');
                        circle.setAttribute('fill', point.color);
                        circle.setAttribute('stroke', '#ffffff');
                        circle.setAttribute('stroke-width', '1');
                        circle.setAttribute('class', 'debug-point');
                        fragment.appendChild(circle);
                        
                        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        text.setAttribute('x', point.x + 8);
                        text.setAttribute('y', point.y - 8);
                        text.setAttribute('class', 'debug-label');
                        text.textContent = `${point.label}(${Math.round(point.x)},${Math.round(point.y)})`;
                        fragment.appendChild(text);

                    connections.push({
                        name: config.name,
                        basePath: basePath,
                        animatedPath: animatedPath,
                        pathData: result.path
                    });
                }
                
                // 释放对象池中的对象
                pathPool.release(result);
            });
            
            // 批量DOM更新 - 清空旧内容并添加新内容

            const duration = perfMonitor.endTiming('updateTimes', startTime);

            perfMonitor.updateUI('pool-usage', (pathPool.getUsage().utilization * 100).toFixed(1) + '%');
            perfMonitor.updateUI('memory-usage', (performance.memory?.usedJSHeapSize / 1024 / 1024).toFixed(1) + 'MB' || 'N/A');
        }

        // 节流函数

            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            }
        }

                • 最大时间: ${max.toFixed(2)}ms
                • 缓存命中率: ${pathCache.getHitRate()}%
                • 对象池利用率: ${(pathPool.getUsage().utilization * 100).toFixed(1)}%
            `);
            
            alert(`性能测试完成！\n平均生成时间: ${avg.toFixed(2)}ms\n缓存命中率: ${pathCache.getHitRate()}%`);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeOptimizedConnections);
        
        // 窗口大小变化时重新计算
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(initializeOptimizedConnections, 200);
        });
    </script>
</body>
</html>
